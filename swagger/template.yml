                items: { type: integer }
                example: [12, 15, 19]
      responses:
        200:
          description: Members added (partial skip possible)
          schema:
            type: object
            properties:
              message: { type: string, example: "Group members updated" }
              added_count: { type: integer, example: 2 }
              skipped_count: { type: integer, example: 1 }
