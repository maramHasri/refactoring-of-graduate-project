              message: { type: string, example: "Group deleted successfully" }
  /groups/{group_id}/members:
    post:
      tags: [Student Groups]
      summary: Add students to group
      description: |
        Each `student_id` is the workspace **membership id** of an active student
        already enrolled in the group's subject. Duplicate IDs in the request and
        students already in the group are skipped (`skipped_count`).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
