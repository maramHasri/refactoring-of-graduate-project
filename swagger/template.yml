              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
  /question-banks/community:
    get:
      tags: [Question banks]
      summary: Discover community question banks
      description: |
        Returns all active question banks with visibility COMMUNITY across the entire platform.
        No workspace or subject assignment is required to discover them.
        Use GET /question-banks/{bank_id} and GET /question-banks/{bank_id}/questions
        (with your X-Workspace-Id) to browse content from any workspace.
      security: [{ Bearer: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Paginated community banks
          schema:
            type: object
            properties:
              question_banks: { type: array, items: { type: object } }
              count: { type: integer }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
  /question-banks/{bank_id}/questions:
    post:
      tags: [Question banks]
      summary: Add questions to bank (add questions bulk)
      description: |
        Always send `{ "questions": [ ... ] }` — use one element for a single question
        or many for a full editing session. All questions are created in one transaction;
        if any item fails, nothing is saved.
        Supported type_code values: MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.
        Optional topic_id per question — must be a topic under the bank's subject
        (list topics via GET /subjects/{subject_id}/topics).
        Requires TEACHER assignment on the bank's subject (or workspace admin/owner).
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [questions]
            properties:
              questions:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [type_code, body]
                  properties:
                    type_code:
                      type: string
                      enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY]
                    body: { type: string }
                    image_path:
                      type: string
                      description: Optional image path from POST /uploads/images
                    explanation: { type: string }
                    points: { type: number }
                    difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                    topic_id:
                      type: integer
                      description: Optional. Must belong to the bank's subject (same workspace).
                    choices:
                      type: array
                      items:
                        type: object
                        required: [body, is_correct]
                        properties:
                          body: { type: string }
                          is_correct: { type: boolean }
                          order_index: { type: integer }
            example:
              questions:
                - type_code: MCQ
                  body: "What is 2 + 2?"
                  image_path: "questions/12/33/abc123.png"
                  topic_id: 11
                  points: 2
                  difficulty: EASY
                  choices:
                    - { body: "4", is_correct: true }
                    - { body: "5", is_correct: false }
                - type_code: ESSAY
                  body: "Explain photosynthesis."
                  topic_id: 12
                  points: 5
                  difficulty: MEDIUM
      responses:
        201:
          description: Questions created
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions: { type: array, items: { type: object } }
    get:
      tags: [Question banks]
      summary: List questions in bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Questions in bank
  /question-banks/{bank_id}/questions/{question_id}:
    patch:
      tags: [Question banks]
      summary: Update question in bank
      description: |
        Partial update for one question. Requires TEACHER assignment on the bank's subject
        (or workspace admin/owner). Supported type_code values: MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - name: question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              type_code:
                type: string
                enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY]
              body: { type: string }
              image_path:
                type: string
                description: Optional image path from POST /uploads/images (set null/empty with remove_image=true to clear)
              remove_image: { type: boolean, default: false }
              explanation: { type: string }
              points: { type: number }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              topic_id: { type: integer }
              choices:
                type: array
                items:
                  type: object
                  required: [body, is_correct]
                  properties:
                    body: { type: string }
                    is_correct: { type: boolean }
                    order_index: { type: integer }
      responses:
        200:
          description: Question updated
        404:
          description: Question not found in bank
    delete:
      tags: [Question banks]
      summary: Delete question from bank
      description: Soft-deletes the question by setting status to ARCHIVED.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - name: question_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question archived
        404:
          description: Question not found in bank
  /question-banks/{bank_id}:
    get:
      tags: [Question banks]
      summary: Get question bank details
      description: |
        Returns bank metadata. COMMUNITY banks are readable from any workspace.
        PRIVATE/WORKSPACE banks require normal visibility rules in your workspace.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question bank metadata
        403:
          description: Forbidden
        404:
          description: Not found
    patch:
      tags: [Question banks]
      summary: Update question bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              visibility: { type: string, enum: [PRIVATE, WORKSPACE, COMMUNITY] }
      responses:
        200:
          description: Updated
    delete:
      tags: [Question banks]
      summary: Archive question bank (soft delete)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Archived
  # ── Tests — teacher/admin management ────────────────────────────────────
  /tests:
    get:
      tags: [Tests]
      summary: List my tests (paginated)
      description: |
        Primary exam list for the teacher `/exams` page.
        Supports `page`, `per_page`, and `include_archived` query params.
        Each item in `tests[]` includes exam-card stats plus `questions_count`
        (alias `question_count`) and `title` (same value as `name`).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
          description: Max 100
        - name: include_archived
          in: query
          type: boolean
          default: false
          description: When false, tests with status ARCHIVED are excluded
      responses:
        200:
          description: Paginated list of tests created by current membership
          schema:
            type: object
            properties:
              count:
                type: integer
                description: Number of items in the current page
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
              tests:
                type: array
                items:
                  $ref: "#/definitions/TestSummary"
    post:
      tags: [Tests]
      summary: Create test (exam)
      description: |
        Step 1 exam creation payload from UI.
        Scheduling, publish timing, and advanced settings are configured in later steps.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [name, subject_id]
            properties:
              name: { type: string, example: "Midterm Exam" }
              description: { type: string }
              subject_id: { type: integer, example: 1 }
              availability_time_mode:
                type: string
                enum: [SCHEDULED, FLEXIBLE, SURVEY]
                description: |
                  SCHEDULED = strict global time; FLEXIBLE = per-attempt elapsed time;
                  SURVEY = no personal duration, deadline = closed_at (required).
              duration_minutes:
                type: integer
                example: 30
                x-nullable: true
                description: |
                  Required for exams when starting an attempt. Default 30 for non-Survey
                  creates when omitted. Must be null for SURVEY.
              closed_at:
                type: string
                format: date-time
                x-nullable: true
                description: |
                  Required for SURVEY — availability deadline (local app timezone).
                  Optional for FLEXIBLE — planned availability end; when reached the
                  background job sets status=CLOSED via the same close path as manual
                  close (in-progress attempts keep their expires_at timer).
                  Ignored for SCHEDULED on create.
              total_score:
                type: number
                default: 100
                example: 100
                description: |
                  When `auto_distribute_scores=true`, stored as `target_total_score` and
                  distributed across questions when they are added.
                  When `auto_distribute_scores=false`, the API still accepts this for
                  create-time passing_score validation only; persisted `total_score`
                  becomes `sum(question.points)` after questions exist.
              passing_score:
                type: number
                default: 50
                example: 50
                description: Passing score (must be ≤ calculated total / target)
              auto_distribute_scores: { type: boolean, example: false }
      responses:
        201:
          description: Test created
          schema:
            type: object
            properties:
              message: { type: string, example: "Test created successfully" }
              test:
                type: object
                properties:
                  test_id: { type: integer }
                  name: { type: string }
                  description: { type: string }
                  subject_id: { type: integer }
                  subject_name: { type: string }
                  duration_minutes: { type: integer }
                  total_score: { type: number, description: "Calculated sum of question points" }
                  target_total_score:
                    type: number
                    x-nullable: true
                    description: Teacher target used when auto_distribute_scores is true
                  passing_score: { type: number }
                  auto_distribute_scores: { type: boolean }
                  status: { type: string, example: DRAFT }
                  slug: { type: string }
                  created_at: { type: string, format: date-time }
                  test_link:
                    type: string
                    example: "http://localhost:5173/tests/15"
                    description: |
                      Shareable student access URL (derived from FRONTEND_BASE_URL + test_id).
                      Not stored in the database.
  /tests/my:
    get:
      tags: [Tests]
      summary: My tests (current membership)
      description: |
        Alias of `GET /tests` — same pagination, filters, and response shape.
        Lists tests created by the current membership.
        Each item includes exam-card stats:
        - `participants_count`: distinct students with an IN_PROGRESS, SUBMITTED, or GRADED attempt
        - `average_score`: mean of GRADED attempt `final_score` (fallback `raw_score`); null when none
        - `graded_attempts_count`: count of GRADED attempts
        - `submitted_attempts_count`: count of SUBMITTED attempts awaiting grading/approval
        - `questions_count` / `question_count`: number of TestQuestion rows linked to the test
        - `title`: same value as `name` for frontend card compatibility
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: include_archived
          in: query
          type: boolean
          default: false
      responses:
        200:
          description: Paginated list created tests
          schema:
            type: object
            properties:
              count: { type: integer }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
              tests:
                type: array
                items:
                  $ref: "#/definitions/TestSummary"
  /tests/{test_id}:
    get:
      tags: [Tests]
      summary: Get test details with snapshot questions
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test detail
    patch:
      tags: [Tests]
      summary: Update test settings
      description: |
        Editing is allowed for:
        - DRAFT tests
        - SCHEDULED tests only when scheduled_publish_at is at least 30 minutes away.

        Scoring rules:
        - With `auto_distribute_scores=true`, `total_score` updates `target_total_score`
          and redistributes points across active questions.
        - With `auto_distribute_scores=false`, `total_score` is read-only (sum of question points);
          sending it returns 422.
        - Manual `points` edits require `auto_distribute_scores=false`.
        - Changing score structure after student attempts returns 409.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              name: { type: string }
              slug: { type: string }
              description: { type: string }
              total_score:
                type: number
                description: Target total when auto_distribute_scores is true
              passing_score: { type: number }
              auto_distribute_scores: { type: boolean }
              settings_config:
                type: object
                description: |
                  Exam control settings.
                  Proctoring is active server-side via proctoring.enabled.
                  Other keys are stored for exam runtime/front-end controls.
                properties:
                  proctoring:
                    type: object
                    properties:
                      enabled: { type: boolean }
                  attempt_settings:
                    type: object
                    properties:
                      max_attempts: { type: integer, minimum: 1, default: 1 }
                  navigation_settings:
                    type: object
                    properties:
                      sequential_navigation: { type: boolean }
                      allow_back_navigation: { type: boolean }
                  answer_rules:
                    type: object
                    properties:
                      require_answer_all: { type: boolean }
                      allow_skip_questions: { type: boolean }
                  display_settings:
                    type: object
                    properties:
                      shuffle_questions: { type: boolean }
                      shuffle_choices: { type: boolean }
                  review_settings:
                    type: object
                    properties:
                      allow_review_after_grading:
                        type: boolean
                        description: "When enabled, students may open graded attempt content for study (questions, their answers, correct answers, explanations, and teacher feedback). Does not control score or results visibility."
              closed_at:
                type: string
                format: date-time
                x-nullable: true
                description: |
                  Planned availability end for SURVEY (required) and FLEXIBLE (optional).
                  Local app timezone datetime. Must be in the future when set on FLEXIBLE.
              availability_time_mode: { type: string, enum: [SCHEDULED, FLEXIBLE, SURVEY] }
              starts_at: { type: string, format: date-time }
              duration_minutes: { type: integer, x-nullable: true }
              entry_window_minutes: { type: integer }
      responses:
        200:
          description: Test updated (excludes published_at, closed_at, archived_at)
        409:
          description: Scheduled exam time conflict (student or teacher)
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [SCHEDULE_CONFLICT, TEACHER_SCHEDULE_CONFLICT]
    delete:
      tags: [Tests]
      summary: Delete test (creator only)
      description: |
        Permanently deletes a test and its questions, assignments, and related data.
        Only the membership that created the test may delete it.
        Fails if any student attempts exist for this test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test deleted
        403:
          description: Not the test creator
        422:
          description: Test has student attempts
  /tests/{test_id}/questions:
    post:
      tags: [Tests]
      summary: Add bank questions to test as snapshots
      description: Snapshot is created immediately when questions are added to test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [question_ids]
            properties:
              question_ids:
                type: array
                items: { type: integer }
              source_type:
                type: string
                enum: [AI, QUESTION_BANK, RANDOM_FROM_BANK, MANUAL, IMPORT]
                default: QUESTION_BANK
      responses:
        201:
          description: Questions added
  /tests/{test_id}/questions/manual:
    post:
      tags: [Tests]
      summary: Add manual questions to exam
      consumes: [application/json]
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [questions]
            properties:
              questions:
                type: array
                items:
                  type: object
                  required: [type_code, body, topic_id]
                  properties:
                    type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
                    body: { type: string }
                    image_path:
                      type: string
                      description: Optional image path from POST /uploads/images
                    explanation: { type: string }
                    points: { type: number }
                    difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                    topic_id:
                      type: integer
                      description: Required. Must belong to the same subject as the test.
                    choices: { type: array, items: { type: object } }
      responses:
        201:
          description: Manual questions added
  /tests/{test_id}/questions/import-csv:
    post:
      tags: [Tests]
      summary: Import exam questions from CSV
      description: |
        Upload a teacher-friendly CSV (no JSON in cells). Download the template from
        GET /templates/exam-questions-csv.

        **Columns:** Question Type, Question, Explanation, Difficulty, Points, Topic ID,
        Choice A–F, Correct Answers (letters A–F, e.g. `B` or `ABD`), image_url (optional).

        **image_url (optional):** relative `questions/...` path or full URL from
        `POST /uploads/images` (`image_url` response field). Leave empty for no image.
        Older CSV files without this column remain supported.

        **Supported types:** MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.

        Partial import: valid rows are created; invalid rows are returned in `failed_rows`.
        Legacy format (`type_code`, `body`, `choices` as JSON) is still accepted.
      consumes: [multipart/form-data]
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: csv_file
          in: formData
          type: file
          required: true
      responses:
        201:
          description: CSV questions imported (possibly with row failures)
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions:
                type: array
                items: { type: object }
              failed_count: { type: integer }
              failed_rows:
                type: array
                items:
                  type: object
                  properties:
                    row: { type: integer }
                    error: { type: string }
  /templates/exam-questions-csv:
    get:
      tags: [Templates]
      summary: Download exam questions CSV template
      description: |
        Returns a UTF-8 CSV template with example rows for MCQ, TRUE_FALSE, MULTI_SELECT, and ESSAY.
        Includes optional trailing column `image_url` for question images (from POST /uploads/images).
        Use this file in Excel or Google Sheets before uploading via POST /tests/{test_id}/questions/import-csv.
      produces: [text/csv]
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: CSV template file
          schema:
            type: file
  /tests/{test_id}/questions/from-bank:
    post:
      tags: [Tests]
      summary: Add selected questions from a question bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [bank_id, question_ids]
            properties:
              bank_id: { type: integer }
              question_ids: { type: array, items: { type: integer } }
      responses:
        201:
          description: Question bank selection added
  /tests/{test_id}/questions/random-from-banks:
    post:
      tags: [Tests]
      summary: Generate exam questions from blueprint (random-from-banks)
      description: |
        Exam Blueprint Generator. Each bank defines question_count, topic percentages (must sum to 100),
        and per-topic difficulty_distribution (easy + medium + hard = 100).
        Questions are randomly selected per bank/topic/difficulty and snapshotted into the test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [banks]
            properties:
              banks:
                type: array
                items:
                  type: object
                  required: [bank_id, question_count, topics]
                  properties:
                    bank_id: { type: integer, example: 3 }
                    question_count: { type: integer, example: 20 }
                    topics:
                      type: array
                      items:
                        type: object
                        required: [topic_id, percentage, difficulty_distribution]
                        properties:
                          topic_id: { type: integer, example: 11 }
                          percentage: { type: integer, example: 30 }
                          difficulty_distribution:
                            type: object
                            required: [easy, medium, hard]
                            properties:
                              easy: { type: integer, example: 20 }
                              medium: { type: integer, example: 50 }
                              hard: { type: integer, example: 30 }
      responses:
        201:
          description: Blueprint generated successfully
          schema:
            type: object
            properties:
              message: { type: string, example: "Blueprint generated successfully" }
              count: { type: integer }
              summary:
                type: array
                items:
                  type: object
                  properties:
                    bank_id: { type: integer }
                    requested: { type: integer }
                    inserted: { type: integer }
              questions: { type: array, items: { type: object } }
        400:
          description: Validation error (percentages, insufficient pool, topic not in bank)
  /tests/{test_id}/questions/ai-generate:
    post:
      tags: [AI Question Generation Flow]
      summary: Generate AI questions for review (does not import yet)
      description: |
        Stage 1 of the AI flow: generation + review storage only.
        Creates `ai_generation_requests` and `ai_generated_questions` records.
        Does NOT add questions directly to test_questions.

        Subject name and selected topic names are taken from the exam context and included in the AI prompt.
        `topic_ids` is required and every topic must belong to the exam subject.
        Provider is selected via AI_QUESTION_PROVIDER (.env):
        - `qwen` — Alibaba DashScope (DASHSCOPE_API_KEY) or HuggingFace Qwen (HF_TOKEN)
        - `gemini` — Google Gemini (GEMINI_API_KEY, default model gemini-2.5-flash)
        - `openrouter` — OpenRouter chat models (OPENROUTER_API_KEY + OPENROUTER_MODEL)
        - `huggingface` — HF router (HF_TOKEN + HF_QWEN_MODEL)
        - `placeholder` — local draft questions without external API
        - `auto` — gemini → openrouter → qwen → huggingface → placeholder (first available)
        In development, AI_FALLBACK_TO_PLACEHOLDER=true uses placeholders on quota/404 errors.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [topic_ids, count]
            properties:
              topic_ids:
                type: array
                items: { type: integer }
                minItems: 1
              count: { type: integer, example: 10 }
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY], default: MCQ }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              learning_objectives: { type: array, items: { type: string } }
              additional_instructions: { type: string }
      responses:
        201:
          description: AI questions generated and stored for teacher review
          schema:
            type: object
            properties:
              message: { type: string, example: "AI questions generated for review" }
              generation_request_id: { type: integer }
              generation_status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
              count: { type: integer }
              subject_name: { type: string }
              ai_model: { type: string, example: Qwen/Qwen2.5-7B-Instruct }
              generated_questions: { type: array, items: { type: object } }
  /tests/{test_id}/questions/import-ai:
    post:
      tags: [AI Question Generation Flow]
      summary: Import approved AI generated questions into test
      description: |
        Stage 2 of the AI flow: import selected generated questions into the exam snapshots.
        Only questions from the specified request and in PENDING_REVIEW status are imported.
        Imported rows are marked with status IMPORTED.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [request_id, question_ids]
            properties:
              request_id: { type: integer }
              question_ids:
                type: array
                items: { type: integer }
      responses:
        201:
          description: AI questions imported into test
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions: { type: array, items: { type: object } }
  /ai-generation-requests/{request_id}:
    get:
      tags: [AI Question Generation Flow]
      summary: Get AI generation request and generated questions
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: request_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Generation request details
          schema:
            type: object
            properties:
              request: { type: object }
              generated_questions:
                type: array
                items: { type: object }
              count: { type: integer }
  /ai-generated-questions/{id}:
    put:
      tags: [AI Question Generation Flow]
      summary: Update generated AI question before import
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [question_text, type_code, options, topic_id]
            properties:
              question_text: { type: string }
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
              options: { type: array, items: { type: object } }
              explanation: { type: string }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              points: { type: number }
              topic_id: { type: integer }
      responses:
        200:
          description: AI generated question updated
          schema:
            type: object
            properties:
              message: { type: string }
              question: { type: object }
    delete:
      tags: [AI Question Generation Flow]
      summary: Delete generated AI question before import
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: AI generated question deleted
  /tests/{test_id}/questions/{test_question_id}:
    patch:
      tags: [Tests]
      summary: Update exam question snapshot
      description: |
        Partial update of a test_questions snapshot row. Allowed only while test is DRAFT
        and no student attempts exist. Does not modify the source question bank.
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
              body: { type: string }
              image_path:
                type: string
                description: Optional image path from POST /uploads/images
              remove_image: { type: boolean, default: false }
              explanation: { type: string }
              points: { type: number }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              topic_id: { type: integer }
              choices:
                type: array
                items:
                  type: object
                  properties:
                    body: { type: string }
                    is_correct: { type: boolean }
                    order_index: { type: integer }
      responses:
        200:
          description: Question updated
        422:
          description: Test not DRAFT or validation error
    delete:
      tags: [Tests]
      summary: Remove question from exam
      description: |
        Hard-deletes the test_questions snapshot. Allowed only while test is DRAFT
        and no student attempts exist.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question removed
        404:
          description: Question not found
        422:
          description: Test not DRAFT or attempts exist
  /tests/{test_id}/assign-students:
    post:
      tags: [Tests]
      summary: Assign students to exam whitelist
      description: |
        Creates or updates explicit allowed students for the exam
        (`TestStudentAssignment` is the source of truth after assign).

        Provide `student_membership_ids` and/or `group_ids` (at least one required).
        `group_ids` expands to current members of groups **owned by the caller**
        in the same subject as the test. Later group membership changes do not
        alter existing assignments automatically.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              student_membership_ids:
                type: array
                items: { type: integer }
                example: [15, 22]
              group_ids:
                type: array
                items: { type: integer }
                example: [3, 4]
                description: Optional owned student groups to expand into members
      responses:
        201:
          description: Students assigned successfully
        409:
          description: Scheduled exam time conflict for assigned students
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/assigned-students:
    get:
      tags: [Tests]
      summary: List exam assigned students
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Assigned students list
  /tests/{test_id}/assigned-students/{membership_id}:
    delete:
      tags: [Tests]
      summary: Remove assigned student from exam
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: membership_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Student removed from assigned list
  /tests/{test_id}/publish-now:
    post:
      tags: [Tests]
      summary: Publish test immediately
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test published
        409:
          description: Scheduled exam time conflict
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/schedule-publication:
    post:
      tags: [Tests]
      summary: Schedule test publication
      description: |
        Sets status to SCHEDULED and stores publish_at in scheduled_publish_at.
        Send naive local datetime (no Z suffix), e.g. `2026-06-29T08:00:00`.
        Times use APP_TIMEZONE from server config (default Asia/Damascus).
        A background job checks periodically and:
        1) auto-publishes due SCHEDULED tests,
        2) auto-submits overdue attempts,
        3) auto-closes PUBLISHED scheduled exams after `starts_at + duration_minutes`.
        You can also run `flask publish-due-tests` manually for publish.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [publish_at]
            properties:
              publish_at:
                type: string
                example: "2026-06-29T08:00:00"
                description: Local wall-clock time (APP_TIMEZONE). No Z or offset suffix.
      responses:
        200:
          description: Test scheduled
        409:
          description: Scheduled exam time conflict for assigned students
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/close:
    post:
      tags: [Tests]
      summary: Close test
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test closed
  /tests/{test_id}/archive:
    post:
      tags: [Tests]
      summary: Archive test
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test archived
  # ── Student Exams — runtime (take exam, attempts, submit) ───────────────
  /student/tests:
    get:
      tags: [Student Exams]
      summary: List all student exams across lifecycle states
      description: |
        Unified exam hub for the authenticated student in the current workspace.

        Returns every exam the student interacts with, mapped to a single
        `lifecycle_status` per row:

        - `UPCOMING` — assigned and not yet started (no attempt yet)
        - `IN_PROGRESS` — active attempt the student may resume (`can_resume`, `resume_attempt_id`)
        - `PENDING_GRADING` — submitted (`attempt_status=SUBMITTED`); use `submission_source`
          (`STUDENT`, `TIMEOUT`, `FORCE`, `PROCTORING_AUTO`) to distinguish manual submit vs timeout
          vs teacher force-submit vs automatic proctoring termination. When `PROCTORING_AUTO`,
          also read `termination_reason` (e.g. `PROCTORING_THRESHOLD_EXCEEDED`).
        - `GRADED` — graded attempt with score and optional `review_allowed`

        Sorted by lifecycle priority (in progress first), then most recent activity.
        Default page size is 20. Optional `lifecycle_status` filter.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
          description: Max 100
        - name: lifecycle_status
          in: query
          type: string
          enum: [UPCOMING, IN_PROGRESS, PENDING_GRADING, GRADED]
          required: false
      responses:
        200:
          description: Paginated student exams
          schema:
            $ref: "#/definitions/StudentExamsListResponse"
        403:
          description: Not an active student
  /student/recent-exams:
    get:
      tags: [Student Exams]
      summary: List recent exams for the student dashboard
      description: |
        Returns the authenticated student's most recent submitted/graded attempts
        for the Student Dashboard **Recent Exams** table.

        Student is resolved from JWT + `X-Workspace-Id` (no `student_id` parameter).
        Only the caller's own attempts are returned.

        **UI status mapping (from attempt status only):**
        - `GRADED` — grading completed (`status=GRADED`); score is visible
        - `PENDING_GRADING` — attempt submitted; teacher has not finished grading

        **Score rules:** `score` is an object when grading is complete; otherwise `null`.
        `review_allowed` indicates whether the student may open attempt content for study
        (`settings_config.review_settings.allow_review_after_grading`); it does not hide scores.

        Ordered by `submitted_at` descending. Default page size is 10.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
          description: Page number (1-based)
        - name: per_page
          in: query
          type: integer
          default: 10
          description: Items per page (max 100)
      responses:
        200:
          description: Paginated recent exam attempts
          schema:
            $ref: "#/definitions/StudentRecentExamsResponse"
        400:
          description: Invalid pagination query
        401:
          description: Missing or invalid access token
        403:
          description: Not an active student in the workspace
  /student/tests/upcoming:
    get:
      tags: [Student Exams]
      summary: List upcoming tests for the authenticated student
      description: |
        Returns published exams assigned to the student that have not been started or submitted yet.

        **Access:** active user with `MembershipRole=STUDENT` and `MembershipStatus=ACTIVE`.
        Teachers/admins receive 403.

        **Includes:**
        - `PUBLISHED` tests only (not archived)
        - Student must be enrolled in the subject and on the exam whitelist
        - Excludes tests with any attempt in `IN_PROGRESS`, `SUBMITTED`, or `GRADED`

        **Scheduling:**
        - `SCHEDULED` — fixed `start_time`, `end_time`, countdown fields
        - `FLEXIBLE` — `start_time` is null, `availability_note` is "Starts on entry"
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Upcoming tests (JSON array)
          schema:
            type: array
            items:
              $ref: "#/definitions/UpcomingTest"
        403:
          description: Not an active student
  /student/tests/{test_id}/entry:
    get:
      tags: [Student Exams]
      summary: Exam Entry Screen (pre-start)
      description: |
        Read-only payload for the Student Exam Entry Screen shown before starting an exam.

        **Does not:**
        - create or resume an attempt
        - start the countdown timer
        - initialize proctoring
        - return questions or answers

        Verifies the authenticated student is enrolled in the subject and assigned to the exam
        (same access rules as start attempt). Returns exam metadata, timing, rules, instructions,
        and student start/resume state (`can_start`, `already_started`, `resume_attempt_id`).

        Soft blockers (entry window closed, max attempts reached, exam not started yet) set
        `student.can_start=false` so the UI can still render the screen.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
          description: Exam id
      responses:
        200:
          description: Exam entry screen payload
          schema:
            $ref: "#/definitions/StudentExamEntryResponse"
          examples:
            application/json:
              exam:
                id: 39
                title: Midterm Calculus
                description: Covers Chapters 1-4
                subject: { id: 28, name: Mathematics }
                teacher: { name: Sara Hassan }
              time:
                availability_mode: SCHEDULED
                duration_minutes: 60
                starts_at: "2026-07-20T10:00:00+00:00"
                ends_at: "2026-07-20T11:00:00+00:00"
                entry_window_minutes: 5
              summary:
                questions_count: 25
                total_score: 100
                passing_score: 50
              rules:
                allow_back_navigation: false
                allow_skip_questions: true
                require_answer_all: false
                shuffle_questions: true
                shuffle_choices: true
                max_attempts: 2
                proctoring_enabled: true
              instructions:
                - Ensure that your internet connection is stable.
                - Allow camera and microphone access.
                - Do not leave the exam page.
                - The exam will be submitted automatically when the timer expires.
              student:
                remaining_attempts: 1
                can_start: true
                already_started: false
                resume_attempt_id: null
        401:
          description: Missing or invalid access token
        403:
          description: Not enrolled, not assigned, or student access required
        404:
          description: Test not found in workspace
        422:
          description: Exam unavailable (not published / duration not configured)
  /tests/available:
    get:
      tags: [Student Exams]
      summary: List published tests available to take
      description: |
        Students see published tests only if they are:
        - enrolled in the subject
        - assigned in the exam whitelist
        Workspace owner/admin see all published tests in the workspace.

        Each item includes `teacher_name` (creator's full name).
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Available tests
          schema:
            type: object
            properties:
              count: { type: integer }
              tests:
                type: array
                items:
                  $ref: "#/definitions/TestSummary"
  /tests/{test_id}/attempts:
    get:
      tags: [Tests]
      summary: List attempts for a test (teacher/admin)
      description: |
        Requires test creator, workspace owner/admin, or subject-assigned teacher.
        Each attempt includes `student_name` / `user_name` of the attempt owner.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Attempt list
          schema:
            type: object
            properties:
              count: { type: integer }
              attempts:
                type: array
                items:
                  $ref: "#/definitions/TestAttempt"
        403:
          description: Forbidden
    post:
      tags: [Student Exams]
      summary: Start or resume exam attempt
      description: |
        Student must be enrolled in the test subject and assigned in exam whitelist.
        Returns 200 when resuming an in-progress attempt, 201 when starting new.

        Response includes attempt runtime payload plus exam context (`name`,
        `description`, `subject_name`, `teacher_name`), the starter's name as
        `user_name` (also mirrored as `student_name` and on `attempt.user_name`),
        and top-level `teacher_name` for the exam creator.

        **SCHEDULED mode:** Entry window applies only on first attempt. All students share
        `global_end_at = starts_at + duration_minutes`. Resume allowed until global end.

        **FLEXIBLE mode:** No global start/end. Timer starts on first attempt:
        `expires_at = attempt.started_at + duration_minutes`. `starts_at` and
        `entry_window_minutes` are ignored. Each student has an independent countdown.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        201:
          description: Attempt started
          schema:
            $ref: "#/definitions/StartAttemptResponse"
        200:
          description: Attempt resumed
          schema:
            $ref: "#/definitions/StartAttemptResponse"
        409:
          description: Already completed
        403:
          description: Entry window closed or student not assigned
        422:
          description: Test not available
  /tests/{test_id}/attempts/current:
    get:
      tags: [Student Exams]
      summary: Get current in-progress attempt (resume)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: In-progress attempt with questions (student view — no correct answers)
          schema:
            type: object
            properties:
              attempt:
                $ref: "#/definitions/TestAttemptRuntime"
        404:
          description: No in-progress attempt
  /tests/{test_id}/attempts/{attempt_id}:
    get:
      tags: [Student Exams, Tests]
      summary: Get attempt details
      description: |
        Teachers/admins with access see full grading data (questions and answers).

        For the student owner of a **GRADED** attempt:
        - If `allow_review_after_grading=true`: full educational content (questions,
          answers, correct choices, explanations, feedback) plus scores.
        - If `allow_review_after_grading=false`: scores and attempt metadata only;
          `questions` and `answers` are not loaded or returned (`review_allowed=false`).

        During an in-progress attempt, correct-answer flags on choices are hidden
        from the student.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Attempt detail
          schema:
            type: object
            properties:
              attempt:
                $ref: "#/definitions/TestAttemptRuntime"
              review_allowed:
                type: boolean
                x-nullable: true
                description: |
                  For graded own attempts: whether educational content is included.
                  Null when the attempt is not yet graded (or caller is not reviewing
                  a graded own attempt in student mode).
  /tests/{test_id}/attempts/{attempt_id}/answers:
    put:
      tags: [Student Exams]
      summary: Bulk autosave answers
      description: Upsert multiple answers while attempt is IN_PROGRESS. Idempotent per test_question_id.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  $ref: "#/definitions/SaveAnswerItem"
            example:
              answers:
                - test_question_id: 1
                  selected_choice_indices: [0]
                - test_question_id: 2
                  answer_text: "Photosynthesis converts light to chemical energy."
      responses:
        200:
          description: Answers saved
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              answers:
                type: array
                items:
                  $ref: "#/definitions/AttemptAnswer"
        409:
          description: Attempt not in progress
  /tests/{test_id}/attempts/{attempt_id}/answers/{test_question_id}:
    patch:
      tags: [Student Exams]
      summary: Update a single answer (autosave)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            $ref: "#/definitions/SaveAnswerItem"
      responses:
        200:
          description: Answer updated
  /tests/{test_id}/attempts/{attempt_id}/submit:
    post:
      tags: [Student Exams]
      summary: Submit attempt (student)
      description: |
        Finalizes attempt and runs deterministic auto-grading:
        MCQ / TRUE_FALSE / MULTI_SELECT are graded immediately (AUTO_GRADED).
        ESSAY answers become PENDING_REVIEW; attempt status remains SUBMITTED until
        no answers are pending. When all answers are graded, status becomes GRADED
        and a single grading-completion email is sent to the student.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Submitted
          schema:
            $ref: "#/definitions/SubmitAttemptResponse"
  /tests/{test_id}/attempts/{attempt_id}/grading/manual:
    post:
      tags: [Grading]
      summary: Manually grade pending answers (teacher)
      description: |
        Grades only answers with grading_status=PENDING_REVIEW.
        Sets grading_status=MANUALLY_GRADED, optionally stores teacher_feedback.
        When no answers remain pending, attempt status becomes GRADED (first time only
        triggers a single grading-completion email to the student).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  type: object
                  required: [test_question_id, earned_score]
                  properties:
                    test_question_id: { type: integer }
                    earned_score: { type: number, minimum: 0 }
                    teacher_feedback: { type: string }
      responses:
        200:
          description: Manual grades saved (attempt GRADED when no pending answers remain)
  /tests/{test_id}/attempts/{attempt_id}/grading/result:
    get:
      tags: [Grading]
      summary: Get grading result (student or teacher)
      description: |
        If attempt status is SUBMITTED, returns grading_completed=false with a waiting message.
        If GRADED, returns final score, maximum score, percentage (2 decimal places),
        grading summary, and timestamps.
        Access: the student (own attempt), the test creator, subject teachers, or workspace admin.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Grading result payload
          schema:
            type: object
            properties:
              grading_completed: { type: boolean }
              message: { type: string }
              final_score: { type: number }
              maximum_score: { type: number }
              percentage: { type: number }
              grading_summary: { type: object }
              submitted_at: { type: string, format: date-time }
              graded_at: { type: string, format: date-time }
  /tests/{test_id}/attempts/{attempt_id}/grading/final-score:
    patch:
      tags: [Grading]
      summary: Approve or override proctoring-adjusted final score
      description: |
        Teacher approves the suggested proctoring-adjusted score or sets a custom final score.
        Required when proctoring is enabled and the attempt has a proctoring session.
        Sets `final_score`, moves attempt to GRADED, and may trigger grading notification.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [approved]
            properties:
              approved: { type: boolean, example: true }
              final_score: { type: number, example: 85 }
              reason: { type: string, example: "Student violation was accidental" }
      responses:
        200:
          description: Final score approved
          schema:
            type: object
            properties:
              message: { type: string, example: "Final score approved successfully" }
              attempt_id: { type: integer, example: 12 }
              raw_score: { type: number, example: 90 }
              suggested_final_score: { type: number, example: 76.5 }
              final_score: { type: number, example: 85 }
              modified_by: { type: integer, example: 25 }
              status: { type: string, example: GRADED }
  /student/tests/results:
    get:
      tags: [Grading]
      summary: List graded test results for student dashboard
      description: |
        Returns ONLY fully graded attempts (`TestAttemptStatus=GRADED`) for the authenticated
        student in the current workspace.

        **Strict exclusions:** `SUBMITTED`, `IN_PROGRESS`, draft/archived tests, and other
        students' attempts are never included.

        Sorted by `graded_at` descending, then `submitted_at` as fallback.
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Graded results (JSON array)
          schema:
            type: array
            items:
              $ref: "#/definitions/StudentGradedResult"
        403:
          description: Not an active student
  /student/dashboard:
    get:
      tags: [Grading]
      summary: Student dashboard performance analytics
      description: |
        High-level performance summary for the authenticated student's dashboard.
        Student is resolved from JWT + `X-Workspace-Id` (no `student_id`).

        Includes every attempt with `status=GRADED` (and a percentage).
        Review settings do not affect inclusion or score visibility.

        Returns overview averages, best/weakest subjects, and weak topics using the same
        topic mastery classification as subject analytics
        (`NEEDS_IMPROVEMENT` / `WEAKNESS`).

        Empty state (no graded exams) returns zeros/`null`/`[]` with HTTP 200.
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Dashboard analytics summary
          schema:
            $ref: "#/definitions/StudentDashboardAnalytics"
        401:
          description: Missing or invalid access token
        403:
          description: Not an active student in the workspace
  /student/performance-summary:
    get:
      tags: [Grading, Student Exams]
      summary: Compact student performance summary
      description: |
        Authenticated student only (JWT + `X-Workspace-Id`). No `student_id` parameter.

        Built from **GRADED** attempts with a percentage only (same inclusion rules as
        `/student/dashboard`). Excludes `IN_PROGRESS`, `SUBMITTED`, and ungraded work.

        - `average_score` / `highest_score`: means of attempt `percentage` values
        - `best_subject`: highest subject average of those percentages
        - `weak_topics`: topics classified as `NEEDS_IMPROVEMENT` or `WEAKNESS` using the
          same difficulty-weighted mastery and thresholds as
          `GET /student/tests/{test_id}/analytics`, limited to the
          **most recent 5 graded attempts**, merged with `occurrences`

        Empty state returns zeros/`null`/`[]` with HTTP 200.
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Compact performance summary
          schema:
            $ref: "#/definitions/StudentPerformanceSummary"
        401:
          description: Missing or invalid access token
        403:
          description: Not an active student in the workspace
  /student/subjects/{subject_id}/analytics:
    get:
      tags: [Student Exams]
      summary: Subject performance analytics for authenticated student
      description: |
        Topic-based subject analytics computed from already graded attempts only.
        Includes weighted topic performance using difficulty weights:
        EASY=1.0, MEDIUM=1.5, HARD=2.0.

        Excludes in-progress, submitted-only, draft, and ungraded attempts.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Subject analytics
          schema:
            type: object
            properties:
              subject_id: { type: integer }
              subject_name: { type: string }
              overall_performance: { type: number }
              student: { type: object }
              topics:
                type: array
                items:
                  type: object
                  properties:
                    topic_id: { type: integer, nullable: true }
                    topic_name: { type: string }
                    performance: { type: number }
                    classification: { type: string }
                    weighted_earned_points: { type: number }
                    weighted_possible_points: { type: number }
              strengths:
                type: array
                items:
                  type: object
              weaknesses:
                type: array
                items:
                  type: object
        404:
          description: Subject not found or student not enrolled in subject
        403:
          description: Not an active student
  /student/tests/{test_id}/analytics:
    get:
      tags: [Student Exams]
      summary: Topic mastery for one graded test result
      description: |
        Returns topic-level mastery for the student's own graded attempt of this test.
        Uses stored grading scores; does not recalculate grading from scratch.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test analytics
          schema:
            type: object
            properties:
              test_id: { type: integer }
              test_title: { type: string }
              final_score: { type: number }
              percentage: { type: number }
              attempt_id: { type: integer }
              topics:
                type: array
                items:
                  type: object
                  properties:
                    topic_id: { type: integer, nullable: true }
                    topic_name: { type: string }
                    mastery_percentage: { type: number }
                    classification: { type: string }
                    weighted_earned_points: { type: number }
                    weighted_possible_points: { type: number }
        404:
          description: Graded test result not found
        403:
          description: Not an active student
  /tests/{test_id}/attempts/{attempt_id}/force-submit:
    post:
      tags: [Tests]
      summary: Force submit attempt (teacher/admin)
      description: Teacher, workspace owner/admin, or test creator may finalize a student attempt.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Force submitted (submission_source=FORCE)
  /tests/{test_id}/attempts/{attempt_id}/timeout:
    post:
      tags: [Student Exams]
      summary: Finalize attempt on timeout
      description: |
        Called when client timer expires. Also applied automatically when expires_at is reached
        on any attempt read/write. submission_source=TIMEOUT.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Timed out and finalized
  # ── Proctoring — teacher/proctor monitoring ─────────────────────────────
  /tests/{test_id}/monitoring:
    get:
      tags: [Proctoring]
      summary: Teacher monitoring snapshot for all assigned students
      description: |
        Returns a **source-of-truth snapshot** of every student assigned to the test
        (`TestStudentAssignment`), including students who have not started yet.

        **Authorization:** same as other proctoring teacher endpoints
        (`can_manage_test_attempts` — workspace owner/admin, test creator, or assigned
        subject teacher). Workspace-scoped via `X-Workspace-Id`.

        `monitoring_state` is a **derived** view (not a DB enum):
        `NOT_STARTED` | `IN_PROGRESS` | `SUBMITTED` | `TIMED_OUT` | `FORCE_SUBMITTED` |
        `PROCTORING_AUTO_TERMINATED` | `TERMINATED` | `COMPLETED`.

        Automatic proctoring termination uses `submission_source=PROCTORING_AUTO` and
        `termination_reason` (e.g. `PROCTORING_THRESHOLD_EXCEEDED`), distinct from teacher
        `FORCE` force-submit.

        Risk fields reuse `ProctoringRiskService.calculate` (aligned with grading-review).

        **Live updates:** open WebSocket `/ws/proctoring/tests/{test_id}/monitor` after
        loading this snapshot. On reconnect, re-fetch this endpoint (do not rely on WS history).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Monitoring snapshot
          schema:
            type: object
            properties:
              test_id: { type: integer }
              name: { type: string }
              title: { type: string }
              count: { type: integer }
              monitoring:
                type: object
                properties:
                  total_assigned_students: { type: integer }
                  not_started: { type: integer }
                  in_progress: { type: integer }
                  submitted: { type: integer }
                  timed_out: { type: integer }
                  force_submitted: { type: integer }
                  proctoring_auto_terminated: { type: integer }
                  terminated: { type: integer }
                  completed: { type: integer }
              students:
                type: array
                items:
                  $ref: "#/definitions/MonitoringStudentRow"
        403:
          description: Insufficient proctoring permissions
        404:
          description: Test not found in workspace
  /tests/{test_id}/proctoring/sessions:
    get:
      tags: [Proctoring]
      summary: List active proctoring sessions for a test
      description: Teacher, admin, or test creator only.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Active proctoring sessions
  /tests/{test_id}/attempts/{attempt_id}/proctoring/session:
    post:
      tags: [Student Exams]
      summary: Start proctoring session
      description: |
        Student only. Also auto-started when attempt begins if test.settings_config.proctoring.enabled is true.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              device_metadata: { type: object }
              browser_metadata: { type: object }
      responses:
        201:
          description: Session started
    get:
      tags: [Student Exams, Proctoring]
      summary: Get proctoring session status
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Session status
  /tests/{test_id}/attempts/{attempt_id}/proctoring/events:
    get:
      tags: [Proctoring]
      summary: List proctoring events for an attempt (teacher/proctor)
      description: |
        Chronological event timeline for investigation. Proctor access required.
        Reuses repository filters `since` and `limit`.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - name: since
          in: query
          type: string
          format: date-time
          required: false
        - name: limit
          in: query
          type: integer
          default: 500
          description: Max events (1-1000)
      responses:
        200:
          description: Event timeline
          schema:
            type: object
            properties:
              count: { type: integer }
              events:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    session_id: { type: integer }
                    event_type: { type: string }
                    payload: { type: object }
                    occurred_at: { type: string, format: date-time }
                    source: { type: string }
        403:
          description: Insufficient proctoring permissions
    post:
      tags: [Student Exams]
      summary: Ingest proctoring event (REST)
      description: Student generates events. WebSocket channel is preferred for real-time.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [event_type]
            properties:
              event_type: { type: string, example: TAB_SWITCH }
              payload: { type: object }
      responses:
        201:
          description: Event recorded (may include violation)
  /tests/{test_id}/attempts/{attempt_id}/proctoring/violations:
    get:
      tags: [Student Exams, Proctoring]
      summary: List violations for attempt
      description: Students see their own violations (limited fields). Teachers/proctors see full details.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Violations list
  /tests/{test_id}/attempts/{attempt_id}/proctoring/violations/{violation_id}/evidence:
    get:
      tags: [Student Exams, Proctoring]
      summary: Get evidence package for violation
      description: MEDIUM and HIGH violations include forensic evidence package.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - name: violation_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Evidence package
  /tests/{test_id}/attempts/{attempt_id}/proctoring/violations/{violation_id}/review:
    post:
      tags: [Proctoring]
      summary: Review violation (proctor/admin)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: violation_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [REVIEWED, DISMISSED, CONFIRMED] }
              review_notes: { type: string }
      responses:
        200:
          description: Violation reviewed
  /tests/{test_id}/attempts/{attempt_id}/proctoring/grading-review:
    get:
      tags: [Proctoring, Grading]
      summary: Get proctoring grading review for teacher
      description: |
        Returns raw score, proctoring risk percentage, suggested final score, and approval state.
        Available when proctoring is enabled and the attempt has a proctoring session.
        Requires all answers to be graded (no PENDING_REVIEW essay answers).
        Teacher/admin access only.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Proctoring grading review payload
          schema:
            type: object
            properties:
              attempt_id: { type: integer, example: 12 }
              raw_score: { type: number, example: 90 }
              maximum_score: { type: number, example: 100 }
              proctoring:
                type: object
                properties:
                  risk_percentage: { type: number, example: 15 }
                  effective_violation_score: { type: integer, example: 30 }
                  violations_count: { type: integer, example: 4 }
                  high_severity_count: { type: integer, example: 1 }
                  medium_severity_count: { type: integer, example: 2 }
                  low_severity_count: { type: integer, example: 1 }
              penalty: { type: number, example: 13.5 }
              suggested_final_score: { type: number, example: 76.5 }
              current_final_score: { type: number }
              requires_teacher_approval: { type: boolean, example: true }
  /tests/{test_id}/attempts/{attempt_id}/proctoring/report:
    get:
      tags: [Proctoring]
      summary: Get unified proctoring integrity report for a finished attempt
      description: |
        Returns a full cheating/integrity report for one finished attempt:
        attempt termination info, risk summary, session, violations, events timeline,
        and evidence packages.

        **Authorization:** same proctor access as events / monitoring / audit-logs
        (`can_manage_test_attempts` — workspace owner/admin, test creator, or assigned
        subject teacher). Students cannot access this endpoint.

        Attempt must not be `IN_PROGRESS`. A proctoring session must exist.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Unified proctoring report
          schema:
            type: object
            properties:
              attempt:
                type: object
                properties:
                  attempt_id: { type: integer, example: 35 }
                  student_id: { type: integer, example: 12, description: student_membership_id }
                  student_name: { type: string, example: "Ahmed Ali" }
                  test_id: { type: integer, example: 51 }
                  test_title: { type: string, example: "Midterm Exam" }
                  status: { type: string, example: "SUBMITTED" }
                  submission_source:
                    type: string
                    enum: [STUDENT, TIMEOUT, FORCE, PROCTORING_AUTO]
                  started_at: { type: string, format: date-time }
                  submitted_at: { type: string, format: date-time }
                  termination_reason:
                    type: string
                    x-nullable: true
                    example: "PROCTORING_THRESHOLD_EXCEEDED"
              proctoring_summary:
                type: object
                properties:
                  session_status: { type: string, enum: [ACTIVE, TERMINATED, COMPLETED] }
                  risk_percentage: { type: number, example: 15 }
                  effective_violation_score: { type: integer, example: 30 }
                  total_violations: { type: integer, example: 4 }
                  high_severity_count: { type: integer, example: 1 }
                  medium_severity_count: { type: integer, example: 2 }
                  low_severity_count: { type: integer, example: 1 }
              session:
                type: object
                properties:
                  session_id: { type: integer }
                  started_at: { type: string, format: date-time }
                  ended_at: { type: string, format: date-time, x-nullable: true }
                  violation_score: { type: integer }
                  tab_switch_count: { type: integer }
                  metadata: { type: object }
              violations:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    type: { type: string }
                    severity: { type: string }
                    score: { type: integer }
                    status: { type: string }
                    description: { type: string }
                    occurred_at: { type: string, format: date-time }
                    review_status: { type: string }
                    evidence_available: { type: boolean }
              events_timeline:
                type: array
                items:
                  type: object
                  properties:
                    event_type: { type: string }
                    occurred_at: { type: string, format: date-time }
                    source: { type: string }
                    payload: { type: object }
              evidence_packages:
                type: array
                items:
                  type: object
                  properties:
                    violation_id: { type: integer }
                    evidence_type: { type: string, example: "SCREENSHOT" }
                    created_at: { type: string, format: date-time }
                    metadata: { type: object }
              recommendation:
                type: object
                properties:
                  status:
                    type: string
                    enum: [SAFE, NEEDS_REVIEW, SUSPICIOUS]
                  reason: { type: string }
        403:
          description: Insufficient proctoring permissions (students denied)
        404:
          description: Attempt or proctoring session not found
        400:
          description: Attempt still in progress
  /tests/{test_id}/attempts/{attempt_id}/proctoring/audit-logs:
    get:
      tags: [Proctoring]
      summary: Proctoring audit log trail
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Audit logs
  /proctoring/integrity-reports:
    get:
      tags: [Proctoring]
      summary: List persisted proctoring integrity reports
      description: |
        Lists **ProctoringIntegrityReport** rows created automatically when an
        attempt is finalized with `submission_source=PROCTORING_AUTO`.

        **Not** Support `/reports` tickets.

        **Authorization (X-Workspace-Id):**
        - INSTITUTION owner — all reports in the workspace
        - Test creator (teacher) — only reports for tests they created
        - SOLO — workspace owner only
        - Students — 403

        Review status changes do **not** alter attempt scores or attempt counts.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: status
          in: query
          type: string
          enum: [PENDING, CONFIRMED, DISMISSED]
        - name: test_id
          in: query
          type: integer
        - name: subject_id
          in: query
          type: integer
        - name: student_membership_id
          in: query
          type: integer
        - name: search
          in: query
          type: string
          description: Matches student/test/subject/teacher snapshot names
        - name: date_from
          in: query
          type: string
          format: date-time
        - name: date_to
          in: query
          type: string
          format: date-time
      responses:
        200:
          description: Paginated integrity reports
          schema:
            type: object
            properties:
              reports:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    attempt_id: { type: integer }
                    test_id: { type: integer }
                    student_name: { type: string }
                    test_name: { type: string }
                    risk_percentage: { type: number }
                    status: { type: string }
                    recommendation: { type: string }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
        403:
          description: Forbidden
  /proctoring/integrity-reports/{report_id}:
    get:
      tags: [Proctoring]
      summary: Get a persisted proctoring integrity report
      description: |
        Returns the full snapshot stored at PROCTORING_AUTO termination time.
        Independent from the computed `GET .../proctoring/report` endpoint
        (which remains available for live detail/timeline).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: report_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Integrity report detail
        403:
          description: Forbidden
        404:
          description: Not found
    patch:
      tags: [Proctoring]
      summary: Review a proctoring integrity report
      description: |
        Sets status to `CONFIRMED` or `DISMISSED` with optional `review_note`.
        Does **not** change attempt status, scores, or attempt limits.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: report_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [CONFIRMED, DISMISSED]
              review_note:
                type: string
      responses:
        200:
          description: Status updated
        403:
          description: Forbidden
        404:
          description: Not found
        422:
          description: Invalid status
  /join-codes/register-student:
    post:
      tags: [Join codes]
      summary: Register new student with join code
      description: Creates user account and STUDENT membership. No Bearer token required.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password, full_name, join_code]
            properties:
              email: { type: string }
              password: { type: string }
              full_name: { type: string }
              join_code: { type: string, example: "O388NXTZ" }
      responses:
        201:
          description: Student registered and joined workspace
  /join-codes/join:
    post:
      tags: [Join codes]
      summary: Existing user joins as STUDENT
      security: [{ Bearer: [] }]
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              join_code: { type: string }
      responses:
        201:
          description: Joined
  /invites:
    post:
      tags: [Invites]
      summary: Create invitation
      description: |
        Email links and dev response URLs use FRONTEND_BASE_URL (React app), not the API server.
        Frontend pages extract the token and call POST /invites/{token}/register or /accept.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              email: { type: string }
              assigned_role: { type: string, enum: [ADMIN, TEACHER, STUDENT] }
      responses:
        201:
          description: Invite created
          schema:
            type: object
            properties:
              invite_id: { type: integer }
              invited_email: { type: string }
              assigned_role: { type: string }
              expires_at: { type: string }
              email_sent: { type: boolean }
              email_hint: { type: string, description: Present in DEBUG when email_sent is false }
              dev_token: { type: string, description: Development only }
              preview_url: { type: string, example: "http://localhost:5173/invites/{token}" }
              register_url: { type: string, example: "http://localhost:5173/invites/{token}/register" }
              accept_url: { type: string, example: "http://localhost:5173/invites/{token}/accept" }
  /invites/{token}:
    get:
      tags: [Invites]
      summary: Preview invite (read-only, no auth)
      description: Does not mutate database state. Works for guests and logged-in users.
      parameters:
        - name: token
          in: path
          type: string
          required: true
      responses:
        200:
          description: Invite preview (invited_email, role, workspace, status)
  /invites/{token}/register:
    post:
      tags: [Invites]
      summary: Register new user through invitation
      description: Email comes from invitation only. Not under /auth. For users without an account.
      parameters:
        - name: token
          in: path
          type: string
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [full_name, password]
            properties:
              full_name: { type: string, example: "Ali Ahmad" }
              password: { type: string, example: "StrongPassword123" }
      responses:
        201:
          description: User and membership created, invitation accepted
        409:
          description: Account already exists — use POST /invites/{token}/accept after login
  /invites/{token}/accept:
    post:
      tags: [Invites]
      summary: Accept invite (existing user only)
      description: Requires access_token. Email must match invitation invited_email.
      security: [{ Bearer: [] }]
      parameters:
        - name: token
          in: path
          type: string
          required: true
      responses:
        200:
          description: Membership created
  /invites/{token}/reject:
    post:
      tags: [Invites]
      summary: Reject invite (no auth)
      description: Marks invitation as REJECTED. Does not create user or membership.
      parameters:
        - name: token
          in: path
          type: string
          required: true
      responses:
        200:
          description: Rejected
  /admin/institutions/pending:
    get:
      tags: [Super Admin]
      summary: List pending institution registrations
      description: |
        Returns owner users with PENDING_APPROVAL and registration_intents (no workspace yet).
        Requires super admin access_token from POST /auth/superadmin/login.
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Pending institution requests with full registration form data
  /admin/institutions/{user_id}:
    get:
      tags: [Super Admin]
      summary: Get institution registration by owner user_id
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
          description: Institution owner user id (not workspace id)
      responses:
        200:
          description: Registration details (pending, approved, or rejected)
  /admin/institutions/{user_id}/approve:
    post:
      tags: [Super Admin]
      summary: Approve institution registration
      description: |
        Creates INSTITUTION workspace, membership, and profile from stored registration_intent.
        Sets owner user status to ACTIVE.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
          description: Institution owner user id
      responses:
        200:
          description: Approved — workspace created
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              workspace:
                type: object
                properties:
                  id: { type: integer }
                  kind: { type: string, example: INSTITUTION }
                  owner_user_id: { type: integer }
  /admin/institutions/{user_id}/reject:
    post:
      tags: [Super Admin]
      summary: Reject institution registration
      description: |
        Marks registration REJECTED, stores rejection reason, sets user REGISTRATION_REJECTED.
        No workspace is created.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
          description: Institution owner user id
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, example: "Incomplete documentation" }
      responses:
        200:
          description: Rejected
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
  /reports:
    post:
      tags: [Reports]
      summary: Create a support report
      description: |
        Authenticated users can submit a report/support request to platform administration.
        The backend derives `created_by_user_id` from the JWT and optionally derives
        `workspace_id` from the `X-Workspace-Id` header. The request body must not include
        `user_id`, `workspace_id`, or `status`.
      security: [{ Bearer: [] }]
      parameters:
        - in: header
          name: X-Workspace-Id
          type: integer
          required: false
          description: Optional active workspace context for the report
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [title, description, category]
            properties:
              title:
                type: string
                example: "Cannot access my exam"
              description:
                type: string
                example: "The exam page keeps loading and never starts."
              category:
                type: string
                enum: [TECHNICAL, ACCOUNT, CONTENT, CHEATING, OTHER]
                example: TECHNICAL
      responses:
        201:
          description: Report created
          schema:
            type: object
            properties:
              message: { type: string, example: "Report created successfully" }
              report_id: { type: integer, example: 1 }
        401:
          description: Missing or invalid token
        403:
          description: User account is not active or workspace membership is invalid
        422:
          description: Validation error
    get:
      tags: [Reports]
      summary: List my reports
      description: Returns only reports created by the authenticated user.
      security: [{ Bearer: [] }]
      responses:
        200:
          description: User reports
          schema:
            type: object
            properties:
              reports:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: integer, example: 1 }
                    title: { type: string, example: "Cannot access my exam" }
                    category: { type: string, example: TECHNICAL }
                    status: { type: string, example: UNREAD }
                    created_at: { type: string, format: date-time }
        401:
          description: Missing or invalid token
  /reports/{report_id}:
    get:
      tags: [Reports]
      summary: Get my report details
      description: Returns details for a report created by the authenticated user.
      security: [{ Bearer: [] }]
      parameters:
        - name: report_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Report details
          schema:
            type: object
            properties:
              report_id: { type: integer, example: 1 }
              title: { type: string, example: "Cannot access my exam" }
              description: { type: string, example: "The exam page keeps loading and never starts." }
              category: { type: string, example: TECHNICAL }
              status: { type: string, example: UNREAD }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
        401:
          description: Missing or invalid token
        403:
          description: Report does not belong to user
        404:
          description: Report not found
  /api/super-admin/dashboard:
    get:
      tags: [Super Admin]
      summary: Global platform dashboard for super admins
      description: |
        Returns platform-wide aggregated statistics across all organizations.
        Access: Super Admin only.

        Reports section is mapped from current proctoring violation statuses:
        OPEN -> pending, REVIEWED -> under_review, CONFIRMED -> resolved, DISMISSED -> rejected.
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Dashboard metrics
          schema:
            type: object
            properties:
              users:
                type: object
                properties:
                  total: { type: integer, example: 5200 }
                  students: { type: integer, example: 4300 }
                  teachers: { type: integer, example: 700 }
                  organization_admins: { type: integer, example: 120 }
                  super_admins: { type: integer, example: 3 }
                  active_today: { type: integer, example: 310 }
                  active_week: { type: integer, example: 1420 }
                  active_month: { type: integer, example: 3180 }
                  new_this_month: { type: integer, example: 260 }
              organizations:
                type: object
                properties:
                  total: { type: integer, example: 48 }
                  active: { type: integer, example: 44 }
                  suspended: { type: integer, example: 2 }
                  new_this_month: { type: integer, example: 4 }
                  most_active:
                    type: array
                    items:
                      type: object
                      properties:
                        organization_id: { type: integer, example: 6 }
                        organization_name: { type: string, example: "AYAAHT Academy" }
                        active_users: { type: integer, example: 120 }
                        tests_count: { type: integer, example: 35 }
                        attempts_count: { type: integer, example: 450 }
              content:
                type: object
                properties:
                  subjects: { type: integer, example: 220 }
                  topics: { type: integer, example: 1450 }
                  questions: { type: integer, example: 31200 }
                  tests: { type: integer, example: 5800 }
              tests:
                type: object
                properties:
                  total_tests: { type: integer, example: 5800 }
                  total_attempts: { type: integer, example: 102000 }
                  attempts_today: { type: integer, example: 1400 }
                  attempts_week: { type: integer, example: 9300 }
                  attempts_month: { type: integer, example: 37600 }
                  average_score: { type: number, example: 74.3 }
              reports:
                type: object
                properties:
                  total: { type: integer, example: 980 }
                  pending: { type: integer, example: 120 }
                  under_review: { type: integer, example: 210 }
                  resolved: { type: integer, example: 520 }
                  rejected: { type: integer, example: 130 }
        403:
          description: Super admin access required
        401:
          description: Missing or invalid token
  /api/super-admin/reports:
    get:
      tags: [Super Admin Management]
      summary: List all support reports
      description: |
        Platform-wide support report listing for Super Admins.
        Supports pagination and optional filtering by status and category.
      security: [{ Bearer: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: status
          in: query
          type: string
          enum: [UNREAD, IN_REVIEW, REVIEWED, REJECTED]
        - name: category
          in: query
          type: string
          enum: [TECHNICAL, ACCOUNT, CONTENT, CHEATING, OTHER]
      responses:
        200:
          description: Paginated report list
          schema:
            type: object
            properties:
              reports:
                type: array
                items:
                  type: object
                  properties:
                    report_id: { type: integer, example: 1 }
                    title: { type: string, example: "Cannot access my exam" }
                    category: { type: string, example: TECHNICAL }
                    status: { type: string, example: UNREAD }
                    created_at: { type: string, format: date-time }
                    reporter:
                      type: object
                      properties:
                        user_id: { type: integer, example: 10 }
                        full_name: { type: string, example: "Ahmed Ali" }
                        email: { type: string, example: "student@example.com" }
              total: { type: integer, example: 50 }
              page: { type: integer, example: 1 }
              per_page: { type: integer, example: 20 }
              pages: { type: integer, example: 3 }
        403:
          description: Super admin access required
  /api/super-admin/reports/{report_id}:
    get:
      tags: [Super Admin Management]
      summary: Get support report details
      description: |
        Returns full report details for Super Admins. If the report is UNREAD,
        opening it changes its status to IN_REVIEW.
      security: [{ Bearer: [] }]
      parameters:
        - name: report_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Report details
          schema:
            type: object
            properties:
              report_id: { type: integer, example: 1 }
              title: { type: string, example: "Cannot access my exam" }
              description: { type: string, example: "The exam page keeps loading and never starts." }
              category: { type: string, example: TECHNICAL }
              status: { type: string, example: IN_REVIEW }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              reporter:
                type: object
                properties:
                  user_id: { type: integer, example: 10 }
                  full_name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "student@example.com" }
                  role: { type: string, example: STUDENT }
                  workspace_name: { type: string, example: "ABC Academy" }
        403:
          description: Super admin access required
        404:
          description: Report not found
    patch:
      tags: [Super Admin Management]
      summary: Update support report status
      description: |
        Updates only the report status. Title, description, reporter, and workspace
        are immutable through this endpoint.
      security: [{ Bearer: [] }]
      parameters:
        - name: report_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [UNREAD, IN_REVIEW, REVIEWED, REJECTED]
                example: IN_REVIEW
      responses:
        200:
          description: Report status updated
          schema:
            type: object
            properties:
              message: { type: string, example: "Report status updated successfully" }
              report:
                type: object
                properties:
                  report_id: { type: integer, example: 1 }
                  status: { type: string, example: IN_REVIEW }
        403:
          description: Super admin access required
        404:
          description: Report not found
        422:
          description: Invalid report status
  /api/super-admin/organizations/{organization_id}/suspend:
    patch:
      tags: [Super Admin Management]
      summary: Suspend an organization
      description: |
        Suspends a workspace organization (SOLO or INSTITUTION). Data and memberships are preserved.
        Sets workspace status to SUSPENDED and records suspension metadata.
        Suspended organizations are excluded from active workspace access and login workspace selection.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
          description: Workspace id (`workspaces.kind` is SOLO or INSTITUTION)
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                example: "Violation of platform policies"
      responses:
        200:
          description: Organization suspended
          schema:
            type: object
            properties:
              message: { type: string, example: "Organization suspended successfully" }
              organization:
                type: object
                properties:
                  id: { type: integer, example: 1 }
                  name: { type: string, example: "ABC Academy" }
                  organization_type: { type: string, example: INSTITUTION }
                  status: { type: string, example: SUSPENDED }
                  suspended_at: { type: string, format: date-time }
                  suspension_reason: { type: string, example: "Violation of platform policies" }
                  students_count: { type: integer, example: 500 }
                  teachers_count: { type: integer, example: 35 }
                  tests_count: { type: integer, example: 120 }
        404:
          description: Organization not found
        409:
          description: Organization is already suspended
        422:
          description: Validation error
        403:
          description: Super admin access required
  /api/super-admin/organizations/{organization_id}/restore:
    post:
      tags: [Super Admin Management]
      summary: Restore a suspended organization
      description: |
        Restores a previously suspended workspace organization (SOLO or INSTITUTION).
        Sets status to ACTIVE and clears suspension metadata.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Organization restored
          schema:
            type: object
            properties:
              message: { type: string, example: "Organization restored successfully" }
              organization:
                type: object
                properties:
                  id: { type: integer, example: 1 }
                  name: { type: string, example: "ABC Academy" }
                  organization_type: { type: string, example: INSTITUTION }
                  status: { type: string, example: ACTIVE }
                  students_count: { type: integer, example: 500 }
                  teachers_count: { type: integer, example: 35 }
                  admins_count: { type: integer, example: 3 }
                  tests_count: { type: integer, example: 120 }
                  attempts_count: { type: integer, example: 5400 }
        404:
          description: Organization not found
        422:
          description: Organization is not suspended
        403:
          description: Super admin access required
  /api/super-admin/organizations/{organization_id}:
    get:
      tags: [Super Admin Management]
      summary: Get organization details
      description: |
        Complete management view for a specific workspace organization (SOLO or INSTITUTION).
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Organization details
          schema:
            type: object
            properties:
              id: { type: integer, example: 1 }
              name: { type: string, example: "ABC Academy" }
              slug: { type: string, example: "abc-academy" }
              organization_type: { type: string, example: INSTITUTION }
              status: { type: string, example: ACTIVE }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              suspended_at: { type: string, format: date-time }
              suspension_reason: { type: string }
              is_verified_by_superadmin: { type: boolean, example: true }
              owner:
                type: object
                properties:
                  user_id: { type: integer, example: 5 }
                  name: { type: string, example: "Owner Name" }
                  email: { type: string, example: "owner@abc.edu" }
              admins_count: { type: integer, example: 3 }
              students_count: { type: integer, example: 500 }
              teachers_count: { type: integer, example: 35 }
              active_users_count: { type: integer, example: 538 }
              tests_count: { type: integer, example: 120 }
              attempts_count: { type: integer, example: 5400 }
        404:
          description: Organization not found
        403:
          description: Super admin access required
  /api/super-admin/users/{user_id}/suspend:
    patch:
      tags: [Super Admin Management]
      summary: Suspend a user account
      description: |
        Suspends a user account without deleting data or memberships.
        Sets user status to SUSPENDED, records suspension metadata, and revokes active sessions.
        Super admins cannot suspend their own account.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                example: "Repeated policy violations"
      responses:
        200:
          description: User suspended
          schema:
            type: object
            properties:
              message: { type: string, example: "User suspended successfully" }
              user:
                type: object
                properties:
                  id: { type: integer, example: 15 }
                  name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "user@example.com" }
                  status: { type: string, example: SUSPENDED }
                  suspended_at: { type: string, format: date-time }
                  suspension_reason: { type: string, example: "Repeated policy violations" }
                  roles:
                    type: array
                    items: { type: string }
                    example: [TEACHER]
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 2 }
                        name: { type: string, example: "ABC Academy" }
                        organization_type: { type: string, example: INSTITUTION }
                        status: { type: string, example: ACTIVE }
        403:
          description: Forbidden (e.g. self-suspension)
        404:
          description: User not found
        409:
          description: User is already suspended
        422:
          description: Validation error
  /api/super-admin/users/{user_id}/restore:
    post:
      tags: [Super Admin Management]
      summary: Restore a suspended or soft-deleted user
      description: |
        Restores a user account in one of two modes:

        1. Soft-deleted (`deleted_at` set): clears `deleted_at` if still within
           one calendar month from `deleted_at` (APP_TIMEZONE). After the window,
           restore is rejected with a clear error. No automatic hard-delete.
        2. Suspended (`user_status=SUSPENDED` and not soft-deleted): sets status
           to ACTIVE and clears suspension metadata.

        Soft-delete restore takes precedence when `deleted_at` is set.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: User restored
          schema:
            type: object
            properties:
              message: { type: string, example: "User restored successfully" }
              user:
                type: object
                properties:
                  id: { type: integer, example: 15 }
                  name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "user@example.com" }
                  status: { type: string, example: ACTIVE }
                  deleted_at: { type: string, format: date-time, x-nullable: true }
                  roles:
                    type: array
                    items: { type: string }
                    example: [TEACHER]
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 2 }
                        name: { type: string, example: "ABC Academy" }
                        organization_type: { type: string, example: INSTITUTION }
                        status: { type: string, example: ACTIVE }
        403:
          description: Super admin access required, or restore period expired
        404:
          description: User not found
        422:
          description: User is neither soft-deleted nor suspended
  /api/super-admin/users/{user_id}:
    get:
      tags: [Super Admin Management]
      summary: Get user details
      description: |
        Complete management view for a specific user, including memberships and activity stats.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: User details
          schema:
            type: object
            properties:
              id: { type: integer, example: 15 }
              name: { type: string, example: "Ahmed Ali" }
              email: { type: string, example: "user@example.com" }
              status: { type: string, example: ACTIVE }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              last_login_at: { type: string, format: date-time }
              last_activity_at: { type: string, format: date-time }
              email_verified: { type: boolean, example: true }
              is_superadmin: { type: boolean, example: false }
              suspended_at: { type: string, format: date-time }
              suspension_reason: { type: string }
              roles:
                type: array
                items: { type: string }
                example: [TEACHER]
              organizations:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 2 }
                    name: { type: string, example: "ABC Academy" }
                    organization_type: { type: string, example: INSTITUTION }
                    status: { type: string, example: ACTIVE }
              memberships:
                type: array
                items:
                  type: object
                  properties:
                    membership_id: { type: integer, example: 42 }
                    role: { type: string, example: TEACHER }
                    status: { type: string, example: ACTIVE }
                    joined_at: { type: string, format: date-time }
              created_tests_count: { type: integer, example: 12 }
              completed_attempts_count: { type: integer, example: 48 }
        404:
          description: User not found
        403:
          description: Super admin access required
  /api/super-admin/users:
    get:
      tags: [Super Admin Management]
      summary: List all platform users with memberships and roles
      description: |
        Platform-wide user listing for Super Admin user management.
        Supports pagination and filtering by role, organization, status, and search.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: role
          in: query
          type: string
          enum: [ADMIN, TEACHER, STUDENT, SUPER_ADMIN]
        - name: organization_id
          in: query
          type: integer
          description: Filter users by organization workspace id
        - name: status
          in: query
          type: string
          enum: [PENDING_VERIFICATION, PENDING_APPROVAL, REGISTRATION_REJECTED, ACTIVE, SUSPENDED, DISABLED]
        - name: search
          in: query
          type: string
          description: Search by user name or email
      responses:
        200:
          description: Paginated user list
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 15 }
                    name: { type: string, example: "Ahmed Ali" }
                    email: { type: string, example: "user@example.com" }
                    status: { type: string, example: ACTIVE }
                    created_at: { type: string, format: date-time }
                    suspended_at: { type: string, format: date-time }
                    suspension_reason: { type: string }
                    roles:
                      type: array
                      items: { type: string }
                      example: [TEACHER]
                    organizations:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer, example: 2 }
                          name: { type: string, example: "ABC Academy" }
                          organization_type: { type: string, example: INSTITUTION }
                          status: { type: string, example: ACTIVE }
              total: { type: integer, example: 120 }
              page: { type: integer, example: 1 }
              per_page: { type: integer, example: 20 }
              pages: { type: integer, example: 6 }
        403:
          description: Super admin access required

