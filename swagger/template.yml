          name: body
          schema:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
              is_archived: { type: boolean }
      responses:
        200:
          description: Updated
    delete:
      tags: [Subjects]
      summary: Archive subject (soft delete)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Archived
  /subjects/{subject_id}/teachers:
    get:
      tags: [Subjects]
      summary: List teachers assigned to subject
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Teacher assignments
          schema:
            type: object
            properties:
              count: { type: integer }
              teachers:
                type: array
                items:
                  type: object
                  properties:
                    assignment_id: { type: integer }
                    membership_id: { type: integer }
                    subject_id: { type: integer }
                    subject_role: { type: string, example: "TEACHER" }
                    membership_role: { type: string, example: "TEACHER" }
                    full_name: { type: string, example: "Ahmed Ali" }
                    assigned_at: { type: string, format: date-time }
    post:
      tags: [Subjects]
      summary: Assign teacher to subject
      description: Creates subject_memberships row with subject_role=TEACHER
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [membership_id]
            properties:
              membership_id: { type: integer, example: 6 }
      responses:
        201:
          description: Assigned
  /subjects/{subject_id}/teachers/{membership_id}:
    delete:
      tags: [Subjects]
      summary: Remove teacher from subject
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
        - name: membership_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Removed
  /subjects/{subject_id}/students:
    get:
      tags: [Subjects]
      summary: List students enrolled in subject
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Student enrollments
    post:
      tags: [Subjects]
      summary: Enroll students in subject (bulk)
      description: |
        Admin/owner or teacher assigned to this subject.
        Pass one or more workspace student membership IDs in `membership_ids`.
        Students already enrolled are skipped (`skipped_count` / `skipped_membership_ids`).
        Soft-removed enrollments are reactivated.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [membership_ids]
            properties:
              membership_ids:
                type: array
                items: { type: integer }
                minItems: 1
                example: [43, 44, 45]
                description: One or more student membership IDs
      responses:
        201:
          description: Students enrolled (partial skip possible)
          schema:
            type: object
            properties:
              message: { type: string, example: "Students enrolled in subject" }
              enrolled_count: { type: integer, example: 2 }
              skipped_count: { type: integer, example: 1 }
              skipped_membership_ids:
                type: array
                items: { type: integer }
                example: [44]
              assignments:
                type: array
                items: { type: object }
        403:
          description: Forbidden
        404:
          description: Subject or membership not found
        409:
          description: Membership has a conflicting subject role
        422:
          description: Validation error
  /subjects/{subject_id}/students/{membership_id}:
    delete:
      tags: [Subjects]
      summary: Remove student from subject
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
        - name: membership_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Removed
  /subjects/{subject_id}/groups:
    get:
      tags: [Student Groups]
      summary: List student groups for a subject
      description: |
        Assigned subject teachers see **their own** groups only.
        Workspace owner/admin see **all** groups in the subject (read/monitor).
        Returns group summaries with `student_count` and owner info.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Groups in subject
          schema:
            type: object
            properties:
              count: { type: integer, example: 2 }
              groups:
                type: array
                items:
                  $ref: "#/definitions/StudentGroupSummary"
    post:
      tags: [Student Groups]
      summary: Create student group
      description: |
        **Assigned subject teachers only** (institution admin cannot create in this flow).
        Group names must be unique within the subject.
        Students are added separately via POST /groups/{group_id}/members.
        A teacher may own multiple groups in the same subject.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: "Section A" }
              description: { type: string, example: "Morning students" }
      responses:
        201:
          description: Group created
          schema:
            type: object
            properties:
              message: { type: string, example: "Group created successfully" }
              group:
                $ref: "#/definitions/StudentGroup"
        403:
          description: Caller is not an assigned subject teacher
  /subjects/{subject_id}/groups/available-students:
    get:
      tags: [Student Groups]
      summary: List subject students with group availability
      description: |
        Returns all active students enrolled in the subject.
        Each item includes `is_available` and `current_group` when the student
        already belongs to another group in this subject (Student+Subject = one group max).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Enrolled students with availability
          schema:
            type: object
            properties:
              count: { type: integer }
              students:
                type: array
                items:
                  type: object
                  properties:
                    membership_id: { type: integer }
                    name: { type: string }
                    full_name: { type: string }
                    email: { type: string }
                    is_available: { type: boolean }
                    current_group:
                      type: object
                      x-nullable: true
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        owner_membership_id: { type: integer }
                        owner_name: { type: string }
  /groups/{group_id}:
    get:
      tags: [Student Groups]
      summary: Get student group details
      description: Returns group metadata, subject info, member count, and enrolled students.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Group details
          schema:
            $ref: "#/definitions/StudentGroupDetail"
    put:
      tags: [Student Groups]
      summary: Update student group
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              name: { type: string, example: "Section B" }
              description: { type: string, example: "Updated description" }
      responses:
        200:
          description: Group updated
          schema:
            type: object
            properties:
              message: { type: string, example: "Group updated successfully" }
              group:
                $ref: "#/definitions/StudentGroup"
    delete:
      tags: [Student Groups]
      summary: Delete student group
      description: Deletes the group and its memberships only. Does not remove students from the subject.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Group deleted
          schema:
            type: object
            properties:
              message: { type: string, example: "Group deleted successfully" }
  /groups/{group_id}/members:
    post:
      tags: [Student Groups]
      summary: Add students to group
      description: |
        Group **owner** only. Each `student_id` is the workspace membership id of an
        active student enrolled in the group's subject.

        **Atomic:** if any student already belongs to another group in the same subject,
        the whole request is rejected with `error=STUDENT_GROUP_SUBJECT_CONFLICT` and
        `conflicts[]`. Students already in *this* group are skipped (`skipped_count`).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [student_ids]
            properties:
              student_ids:
                type: array
                items: { type: integer }
                example: [12, 15, 19]
      responses:
        200:
          description: Members added
          schema:
            type: object
            properties:
              message: { type: string, example: "Group members updated" }
              added_count: { type: integer, example: 2 }
              skipped_count: { type: integer, example: 1 }
        409:
          description: One or more students already in another group for this subject
          schema:
            type: object
            properties:
              error: { type: string, example: STUDENT_GROUP_SUBJECT_CONFLICT }
              message: { type: string }
              conflicts:
                type: array
                items:
                  type: object
                  properties:
                    membership_id: { type: integer }
                    student_name: { type: string }
                    existing_group_id: { type: integer }
                    existing_group_name: { type: string }
                    existing_group_owner: { type: string }
        403:
          description: Not the group owner
  /groups/{group_id}/members/{student_id}:
    delete:
      tags: [Student Groups]
      summary: Remove student from group
      description: |
        `student_id` is the workspace membership id. Removes only the group membership;
        subject enrollment is unchanged.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: group_id
          in: path
