      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [title, subject_id]
            properties:
              title: { type: string, example: "Algebra Bank" }
              subject_id: { type: integer, example: 1 }
              description: { type: string }
              visibility: { type: string, enum: [PRIVATE, WORKSPACE, COMMUNITY], example: "WORKSPACE" }
      responses:
        201:
          description: Created
  /question-banks/my:
    get:
      tags: [Question banks]
      summary: My question banks (current membership)
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Banks created by you
          schema:
            type: object
            properties:
              count: { type: integer }
              question_banks:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    title: { type: string }
                    description: { type: string }
                    workspace_id: { type: integer }
                    subject_id: { type: integer }
                    subject_name: { type: string, example: "Cyber Security" }
                    visibility: { type: string }
                    is_archived: { type: boolean }
                    created_by_membership_id: { type: integer }
                    created_at: { type: string, format: date-time }
                    updated_at: { type: string, format: date-time }
  /question-banks/workspace:
    get:
      tags: [Question banks]
      summary: Discover workspace question banks (other teachers)
      description: |
        Returns active WORKSPACE visibility banks created by other members in the
        current workspace. Excludes banks created by the current user.
        Teachers see banks only for subjects they teach; workspace owner/admin see
        banks across all workspace subjects.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Paginated workspace banks
          schema:
            type: object
            properties:
              question_banks: { type: array, items: { type: object } }
              count: { type: integer }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
  /question-banks/community:
    get:
      tags: [Question banks]
      summary: Discover community question banks
      description: |
        Returns all active question banks with visibility COMMUNITY across the entire platform.
        No workspace or subject assignment is required to discover them.
        Use GET /question-banks/{bank_id} and GET /question-banks/{bank_id}/questions
        (with your X-Workspace-Id) to browse content from any workspace.
      security: [{ Bearer: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Paginated community banks
          schema:
            type: object
            properties:
              question_banks: { type: array, items: { type: object } }
              count: { type: integer }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
  /question-banks/{bank_id}/questions:
    post:
      tags: [Question banks]
      summary: Add questions to bank (add questions bulk)
      description: |
        Always send `{ "questions": [ ... ] }` — use one element for a single question
        or many for a full editing session. All questions are created in one transaction;
        if any item fails, nothing is saved.
        Supported type_code values: MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.
        Optional topic_id per question — must be a topic under the bank's subject
        (list topics via GET /subjects/{subject_id}/topics).
        Requires TEACHER assignment on the bank's subject (or workspace admin/owner).
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [questions]
            properties:
              questions:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [type_code, body]
                  properties:
                    type_code:
                      type: string
                      enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY]
                    body: { type: string }
                    image_path:
                      type: string
                      description: Optional image path from POST /uploads/images
                    explanation: { type: string }
                    points: { type: number }
                    difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                    topic_id:
                      type: integer
                      description: Optional. Must belong to the bank's subject (same workspace).
                    choices:
                      type: array
                      items:
                        type: object
                        required: [body, is_correct]
                        properties:
                          body: { type: string }
                          is_correct: { type: boolean }
                          order_index: { type: integer }
            example:
              questions:
                - type_code: MCQ
                  body: "What is 2 + 2?"
                  image_path: "questions/12/33/abc123.png"
                  topic_id: 11
                  points: 2
                  difficulty: EASY
                  choices:
                    - { body: "4", is_correct: true }
                    - { body: "5", is_correct: false }
                - type_code: ESSAY
                  body: "Explain photosynthesis."
                  topic_id: 12
                  points: 5
                  difficulty: MEDIUM
      responses:
        201:
          description: Questions created
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions: { type: array, items: { type: object } }
    get:
      tags: [Question banks]
      summary: List questions in bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Questions in bank
  /question-banks/{bank_id}/questions/{question_id}:
    patch:
      tags: [Question banks]
      summary: Update question in bank
      description: |
        Partial update for one question. Requires TEACHER assignment on the bank's subject
        (or workspace admin/owner). Supported type_code values: MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - name: question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              type_code:
                type: string
                enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY]
              body: { type: string }
              image_path:
                type: string
                description: Optional image path from POST /uploads/images (set null/empty with remove_image=true to clear)
              remove_image: { type: boolean, default: false }
              explanation: { type: string }
              points: { type: number }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              topic_id: { type: integer }
              choices:
                type: array
                items:
                  type: object
                  required: [body, is_correct]
                  properties:
                    body: { type: string }
                    is_correct: { type: boolean }
                    order_index: { type: integer }
      responses:
        200:
          description: Question updated
        404:
          description: Question not found in bank
    delete:
      tags: [Question banks]
      summary: Delete question from bank
      description: Soft-deletes the question by setting status to ARCHIVED.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - name: question_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question archived
        404:
          description: Question not found in bank
  /question-banks/{bank_id}:
    get:
      tags: [Question banks]
      summary: Get question bank details
      description: |
        Returns bank metadata. COMMUNITY banks are readable from any workspace.
        PRIVATE/WORKSPACE banks require normal visibility rules in your workspace.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question bank metadata
        403:
          description: Forbidden
        404:
          description: Not found
    patch:
      tags: [Question banks]
      summary: Update question bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              visibility: { type: string, enum: [PRIVATE, WORKSPACE, COMMUNITY] }
      responses:
        200:
          description: Updated
    delete:
      tags: [Question banks]
      summary: Archive question bank (soft delete)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: bank_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Archived
  # ── Tests — teacher/admin management ────────────────────────────────────
  /tests:
    post:
      tags: [Tests]
      summary: Create test (exam)
      description: |
        Step 1 exam creation payload from UI.
        Scheduling, publish timing, and advanced settings are configured in later steps.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [name, subject_id]
            properties:
              name: { type: string, example: "Midterm Exam" }
              description: { type: string }
              subject_id: { type: integer, example: 1 }
              duration_minutes:
                type: integer
                default: 30
                example: 30
                description: Exam duration in minutes (default 30)
              total_score:
                type: number
                default: 100
                example: 100
                description: Maximum score (default 100)
              passing_score:
                type: number
                default: 50
                example: 50
                description: Passing score (default 50)
              auto_distribute_scores: { type: boolean, example: false }
      responses:
        201:
          description: Test created
          schema:
            type: object
            properties:
              message: { type: string, example: "Test created successfully" }
              test:
                type: object
                properties:
                  test_id: { type: integer }
                  name: { type: string }
                  description: { type: string }
                  subject_id: { type: integer }
                  subject_name: { type: string }
                  duration_minutes: { type: integer }
                  total_score: { type: number }
                  passing_score: { type: number }
                  auto_distribute_scores: { type: boolean }
                  status: { type: string, example: DRAFT }
                  slug: { type: string }
                  created_at: { type: string, format: date-time }
                  test_link:
                    type: string
                    example: "http://localhost:5173/tests/15"
                    description: |
                      Shareable student access URL (derived from FRONTEND_BASE_URL + test_id).
                      Not stored in the database.
  /tests/my:
    get:
      tags: [Tests]
      summary: My tests (current membership)
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: List created tests
  /tests/{test_id}:
    get:
      tags: [Tests]
      summary: Get test details with snapshot questions
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test detail
    patch:
      tags: [Tests]
      summary: Update test settings
      description: |
        Editing is allowed for:
        - DRAFT tests
        - SCHEDULED tests only when scheduled_publish_at is at least 30 minutes away.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              name: { type: string }
              slug: { type: string }
              description: { type: string }
              total_score: { type: number }
              passing_score: { type: number }
              settings_config:
                type: object
                description: |
                  Exam control settings.
                  Proctoring is active server-side via proctoring.enabled.
                  Other keys are stored for exam runtime/front-end controls.
                properties:
                  proctoring:
                    type: object
                    properties:
                      enabled: { type: boolean }
                  attempt_settings:
                    type: object
                    properties:
                      max_attempts: { type: integer, minimum: 1, default: 1 }
                  navigation_settings:
                    type: object
                    properties:
                      sequential_navigation: { type: boolean }
                      allow_back_navigation: { type: boolean }
                  answer_rules:
                    type: object
                    properties:
                      require_answer_all: { type: boolean }
                      allow_skip_questions: { type: boolean }
                  display_settings:
                    type: object
                    properties:
                      shuffle_questions: { type: boolean }
                      shuffle_choices: { type: boolean }
                  review_settings:
                    type: object
                    properties:
                      allow_review_after_grading:
                        type: boolean
                        description: "When enabled, students may review their graded attempts, including their answers, correct answers, explanations, and final score."
              availability_time_mode: { type: string, enum: [SCHEDULED, FLEXIBLE] }
              starts_at: { type: string, format: date-time }
              duration_minutes: { type: integer }
              entry_window_minutes: { type: integer }
      responses:
        200:
          description: Test updated (excludes published_at, closed_at, archived_at)
        409:
          description: Scheduled exam time conflict (student or teacher)
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [SCHEDULE_CONFLICT, TEACHER_SCHEDULE_CONFLICT]
    delete:
      tags: [Tests]
      summary: Delete test (creator only)
      description: |
        Permanently deletes a test and its questions, assignments, and related data.
        Only the membership that created the test may delete it.
        Fails if any student attempts exist for this test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test deleted
        403:
          description: Not the test creator
        422:
          description: Test has student attempts
  /tests/{test_id}/questions:
    post:
      tags: [Tests]
      summary: Add bank questions to test as snapshots
      description: Snapshot is created immediately when questions are added to test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [question_ids]
            properties:
              question_ids:
                type: array
                items: { type: integer }
              source_type:
                type: string
                enum: [AI, QUESTION_BANK, RANDOM_FROM_BANK, MANUAL, IMPORT]
                default: QUESTION_BANK
      responses:
        201:
          description: Questions added
  /tests/{test_id}/questions/manual:
    post:
      tags: [Tests]
      summary: Add manual questions to exam
      consumes: [application/json]
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [questions]
            properties:
              questions:
                type: array
                items:
                  type: object
                  required: [type_code, body, topic_id]
                  properties:
                    type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
                    body: { type: string }
                    image_path:
                      type: string
                      description: Optional image path from POST /uploads/images
                    explanation: { type: string }
                    points: { type: number }
                    difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                    topic_id:
                      type: integer
                      description: Required. Must belong to the same subject as the test.
                    choices: { type: array, items: { type: object } }
      responses:
        201:
          description: Manual questions added
  /tests/{test_id}/questions/import-csv:
    post:
      tags: [Tests]
      summary: Import exam questions from CSV
      description: |
        Upload a teacher-friendly CSV (no JSON in cells). Download the template from
        GET /templates/exam-questions-csv.

        **Columns:** Question Type, Question, Explanation, Difficulty, Points, Topic ID,
        Choice A–F, Correct Answers (letters A–F, e.g. `B` or `ABD`), image_url (optional).

        **image_url (optional):** relative `questions/...` path or full URL from
        `POST /uploads/images` (`image_url` response field). Leave empty for no image.
        Older CSV files without this column remain supported.

        **Supported types:** MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY.

        Partial import: valid rows are created; invalid rows are returned in `failed_rows`.
        Legacy format (`type_code`, `body`, `choices` as JSON) is still accepted.
      consumes: [multipart/form-data]
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: csv_file
          in: formData
          type: file
          required: true
      responses:
        201:
          description: CSV questions imported (possibly with row failures)
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions:
                type: array
                items: { type: object }
              failed_count: { type: integer }
              failed_rows:
                type: array
                items:
                  type: object
                  properties:
                    row: { type: integer }
                    error: { type: string }
  /templates/exam-questions-csv:
    get:
      tags: [Templates]
      summary: Download exam questions CSV template
      description: |
        Returns a UTF-8 CSV template with example rows for MCQ, TRUE_FALSE, MULTI_SELECT, and ESSAY.
        Includes optional trailing column `image_url` for question images (from POST /uploads/images).
        Use this file in Excel or Google Sheets before uploading via POST /tests/{test_id}/questions/import-csv.
      produces: [text/csv]
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: CSV template file
          schema:
            type: file
  /tests/{test_id}/questions/from-bank:
    post:
      tags: [Tests]
      summary: Add selected questions from a question bank
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [bank_id, question_ids]
            properties:
              bank_id: { type: integer }
              question_ids: { type: array, items: { type: integer } }
      responses:
        201:
          description: Question bank selection added
  /tests/{test_id}/questions/random-from-banks:
    post:
      tags: [Tests]
      summary: Generate exam questions from blueprint (random-from-banks)
      description: |
        Exam Blueprint Generator. Each bank defines question_count, topic percentages (must sum to 100),
        and per-topic difficulty_distribution (easy + medium + hard = 100).
        Questions are randomly selected per bank/topic/difficulty and snapshotted into the test.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [banks]
            properties:
              banks:
                type: array
                items:
                  type: object
                  required: [bank_id, question_count, topics]
                  properties:
                    bank_id: { type: integer, example: 3 }
                    question_count: { type: integer, example: 20 }
                    topics:
                      type: array
                      items:
                        type: object
                        required: [topic_id, percentage, difficulty_distribution]
                        properties:
                          topic_id: { type: integer, example: 11 }
                          percentage: { type: integer, example: 30 }
                          difficulty_distribution:
                            type: object
                            required: [easy, medium, hard]
                            properties:
                              easy: { type: integer, example: 20 }
                              medium: { type: integer, example: 50 }
                              hard: { type: integer, example: 30 }
      responses:
        201:
          description: Blueprint generated successfully
          schema:
            type: object
            properties:
              message: { type: string, example: "Blueprint generated successfully" }
              count: { type: integer }
              summary:
                type: array
                items:
                  type: object
                  properties:
                    bank_id: { type: integer }
                    requested: { type: integer }
                    inserted: { type: integer }
              questions: { type: array, items: { type: object } }
        400:
          description: Validation error (percentages, insufficient pool, topic not in bank)
  /tests/{test_id}/questions/ai-generate:
    post:
      tags: [AI Question Generation Flow]
      summary: Generate AI questions for review (does not import yet)
      description: |
        Stage 1 of the AI flow: generation + review storage only.
        Creates `ai_generation_requests` and `ai_generated_questions` records.
        Does NOT add questions directly to test_questions.

        Subject name and selected topic names are taken from the exam context and included in the AI prompt.
        `topic_ids` is required and every topic must belong to the exam subject.
        Provider is selected via AI_QUESTION_PROVIDER (.env):
        - `qwen` — Alibaba DashScope (DASHSCOPE_API_KEY) or HuggingFace Qwen (HF_TOKEN)
        - `gemini` — Google Gemini (GEMINI_API_KEY, default model gemini-2.5-flash)
        - `openrouter` — OpenRouter chat models (OPENROUTER_API_KEY + OPENROUTER_MODEL)
        - `huggingface` — HF router (HF_TOKEN + HF_QWEN_MODEL)
        - `placeholder` — local draft questions without external API
        - `auto` — gemini → openrouter → qwen → huggingface → placeholder (first available)
        In development, AI_FALLBACK_TO_PLACEHOLDER=true uses placeholders on quota/404 errors.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [topic_ids, count]
            properties:
              topic_ids:
                type: array
                items: { type: integer }
                minItems: 1
              count: { type: integer, example: 10 }
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY], default: MCQ }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              learning_objectives: { type: array, items: { type: string } }
              additional_instructions: { type: string }
      responses:
        201:
          description: AI questions generated and stored for teacher review
          schema:
            type: object
            properties:
              message: { type: string, example: "AI questions generated for review" }
              generation_request_id: { type: integer }
              generation_status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
              count: { type: integer }
              subject_name: { type: string }
              ai_model: { type: string, example: Qwen/Qwen2.5-7B-Instruct }
              generated_questions: { type: array, items: { type: object } }
  /tests/{test_id}/questions/import-ai:
    post:
      tags: [AI Question Generation Flow]
      summary: Import approved AI generated questions into test
      description: |
        Stage 2 of the AI flow: import selected generated questions into the exam snapshots.
        Only questions from the specified request and in PENDING_REVIEW status are imported.
        Imported rows are marked with status IMPORTED.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [request_id, question_ids]
            properties:
              request_id: { type: integer }
              question_ids:
                type: array
                items: { type: integer }
      responses:
        201:
          description: AI questions imported into test
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              questions: { type: array, items: { type: object } }
  /ai-generation-requests/{request_id}:
    get:
      tags: [AI Question Generation Flow]
      summary: Get AI generation request and generated questions
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: request_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Generation request details
          schema:
            type: object
            properties:
              request: { type: object }
              generated_questions:
                type: array
                items: { type: object }
              count: { type: integer }
  /ai-generated-questions/{id}:
    put:
      tags: [AI Question Generation Flow]
      summary: Update generated AI question before import
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [question_text, type_code, options, topic_id]
            properties:
              question_text: { type: string }
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
              options: { type: array, items: { type: object } }
              explanation: { type: string }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              points: { type: number }
              topic_id: { type: integer }
      responses:
        200:
          description: AI generated question updated
          schema:
            type: object
            properties:
              message: { type: string }
              question: { type: object }
    delete:
      tags: [AI Question Generation Flow]
      summary: Delete generated AI question before import
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: AI generated question deleted
  /tests/{test_id}/questions/{test_question_id}:
    patch:
      tags: [Tests]
      summary: Update exam question snapshot
      description: |
        Partial update of a test_questions snapshot row. Allowed only while test is DRAFT
        and no student attempts exist. Does not modify the source question bank.
      security: [{ Bearer: [], WorkspaceId: [] }]
      consumes: [application/json]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              type_code: { type: string, enum: [MCQ, TRUE_FALSE, MULTI_SELECT, ESSAY] }
              body: { type: string }
              image_path:
                type: string
                description: Optional image path from POST /uploads/images
              remove_image: { type: boolean, default: false }
              explanation: { type: string }
              points: { type: number }
              difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
              topic_id: { type: integer }
              choices:
                type: array
                items:
                  type: object
                  properties:
                    body: { type: string }
                    is_correct: { type: boolean }
                    order_index: { type: integer }
      responses:
        200:
          description: Question updated
        422:
          description: Test not DRAFT or validation error
    delete:
      tags: [Tests]
      summary: Remove question from exam
      description: |
        Hard-deletes the test_questions snapshot. Allowed only while test is DRAFT
        and no student attempts exist.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Question removed
        404:
          description: Question not found
        422:
          description: Test not DRAFT or attempts exist
  /tests/{test_id}/assign-students:
    post:
      tags: [Tests]
      summary: Assign students to exam whitelist
      description: |
        Creates or updates explicit allowed students for the exam.
        Each membership must be an active STUDENT enrolled in the exam subject.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [student_membership_ids]
            properties:
              student_membership_ids:
                type: array
                items: { type: integer }
                example: [15, 22, 35, 40]
      responses:
        201:
          description: Students assigned successfully
        409:
          description: Scheduled exam time conflict for assigned students
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/assigned-students:
    get:
      tags: [Tests]
      summary: List exam assigned students
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Assigned students list
  /tests/{test_id}/assigned-students/{membership_id}:
    delete:
      tags: [Tests]
      summary: Remove assigned student from exam
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: membership_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Student removed from assigned list
  /tests/{test_id}/publish-now:
    post:
      tags: [Tests]
      summary: Publish test immediately
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test published
        409:
          description: Scheduled exam time conflict
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/schedule-publication:
    post:
      tags: [Tests]
      summary: Schedule test publication
      description: |
        Sets status to SCHEDULED and stores publish_at in scheduled_publish_at.
        Send naive local datetime (no Z suffix), e.g. `2026-06-29T08:00:00`.
        Times use APP_TIMEZONE from server config (default Asia/Damascus).
        A background job checks every 5s (configurable) and auto-publishes due tests.
        You can also run `flask publish-due-tests` manually.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [publish_at]
            properties:
              publish_at:
                type: string
                example: "2026-06-29T08:00:00"
                description: Local wall-clock time (APP_TIMEZONE). No Z or offset suffix.
      responses:
        200:
          description: Test scheduled
        409:
          description: Scheduled exam time conflict for assigned students
          schema:
            $ref: "#/definitions/ScheduleConflictError"
  /tests/{test_id}/close:
    post:
      tags: [Tests]
      summary: Close test
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test closed
  /tests/{test_id}/archive:
    post:
      tags: [Tests]
      summary: Archive test
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test archived
  # ── Student Exams — runtime (take exam, attempts, submit) ───────────────
  /student/tests/upcoming:
    get:
      tags: [Student Exams]
      summary: List upcoming tests for the authenticated student
      description: |
        Returns published exams assigned to the student that have not been started or submitted yet.

        **Access:** active user with `MembershipRole=STUDENT` and `MembershipStatus=ACTIVE`.
        Teachers/admins receive 403.

        **Includes:**
        - `PUBLISHED` tests only (not archived)
        - Student must be enrolled in the subject and on the exam whitelist
        - Excludes tests with any attempt in `IN_PROGRESS`, `SUBMITTED`, or `GRADED`

        **Scheduling:**
        - `SCHEDULED` — fixed `start_time`, `end_time`, countdown fields
        - `FLEXIBLE` — `start_time` is null, `availability_note` is "Starts on entry"
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Upcoming tests (JSON array)
          schema:
            type: array
            items:
              $ref: "#/definitions/UpcomingTest"
        403:
          description: Not an active student
  /tests/available:
    get:
      tags: [Student Exams]
      summary: List published tests available to take
      description: |
        Students see published tests only if they are:
        - enrolled in the subject
        - assigned in the exam whitelist
        Workspace owner/admin see all published tests in the workspace.
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Available tests
          schema:
            type: object
            properties:
              count: { type: integer }
              tests:
                type: array
                items:
                  $ref: "#/definitions/TestSummary"
  /tests/{test_id}/attempts:
    get:
      tags: [Tests]
      summary: List attempts for a test (teacher/admin)
      description: Requires test creator, workspace owner/admin, or subject-assigned teacher.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Attempt list
          schema:
            type: object
            properties:
              count: { type: integer }
              attempts:
                type: array
                items:
                  $ref: "#/definitions/TestAttempt"
        403:
          description: Forbidden
    post:
      tags: [Student Exams]
      summary: Start or resume exam attempt
      description: |
        Student must be enrolled in the test subject and assigned in exam whitelist.
        Returns 200 when resuming an in-progress attempt, 201 when starting new.

        **SCHEDULED mode:** Entry window applies only on first attempt. All students share
        `global_end_at = starts_at + duration_minutes`. Resume allowed until global end.

        **FLEXIBLE mode:** No global start/end. Timer starts on first attempt:
        `expires_at = attempt.started_at + duration_minutes`. `starts_at` and
        `entry_window_minutes` are ignored. Each student has an independent countdown.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        201:
          description: Attempt started
          schema:
            $ref: "#/definitions/StartAttemptResponse"
        200:
          description: Attempt resumed
          schema:
            $ref: "#/definitions/StartAttemptResponse"
        409:
          description: Already completed
        403:
          description: Entry window closed or student not assigned
        422:
          description: Test not available
  /tests/{test_id}/attempts/current:
    get:
      tags: [Student Exams]
      summary: Get current in-progress attempt (resume)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: In-progress attempt with questions (student view — no correct answers)
          schema:
            type: object
            properties:
              attempt:
                $ref: "#/definitions/TestAttemptRuntime"
        404:
          description: No in-progress attempt
  /tests/{test_id}/attempts/{attempt_id}:
    get:
      tags: [Student Exams, Tests]
      summary: Get attempt details
      description: Student sees own attempt without correct answers. Teachers see full grading data.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Attempt detail
          schema:
            type: object
            properties:
              attempt:
                $ref: "#/definitions/TestAttemptRuntime"
  /tests/{test_id}/attempts/{attempt_id}/answers:
    put:
      tags: [Student Exams]
      summary: Bulk autosave answers
      description: Upsert multiple answers while attempt is IN_PROGRESS. Idempotent per test_question_id.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  $ref: "#/definitions/SaveAnswerItem"
            example:
              answers:
                - test_question_id: 1
                  selected_choice_indices: [0]
                - test_question_id: 2
                  answer_text: "Photosynthesis converts light to chemical energy."
      responses:
        200:
          description: Answers saved
          schema:
            type: object
            properties:
              message: { type: string }
              count: { type: integer }
              answers:
                type: array
                items:
                  $ref: "#/definitions/AttemptAnswer"
        409:
          description: Attempt not in progress
  /tests/{test_id}/attempts/{attempt_id}/answers/{test_question_id}:
    patch:
      tags: [Student Exams]
      summary: Update a single answer (autosave)
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - name: test_question_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            $ref: "#/definitions/SaveAnswerItem"
      responses:
        200:
          description: Answer updated
  /tests/{test_id}/attempts/{attempt_id}/submit:
    post:
      tags: [Student Exams]
      summary: Submit attempt (student)
      description: |
        Finalizes attempt and runs deterministic auto-grading:
        MCQ / TRUE_FALSE / MULTI_SELECT are graded immediately (AUTO_GRADED).
        ESSAY answers become PENDING_REVIEW; attempt status remains SUBMITTED until
        no answers are pending. When all answers are graded, status becomes GRADED
        and a single grading-completion email is sent to the student.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Submitted
          schema:
            $ref: "#/definitions/SubmitAttemptResponse"
  /tests/{test_id}/attempts/{attempt_id}/grading/manual:
    post:
      tags: [Grading]
      summary: Manually grade pending answers (teacher)
      description: |
        Grades only answers with grading_status=PENDING_REVIEW.
        Sets grading_status=MANUALLY_GRADED, optionally stores teacher_feedback.
        When no answers remain pending, attempt status becomes GRADED (first time only
        triggers a single grading-completion email to the student).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  type: object
                  required: [test_question_id, earned_score]
                  properties:
                    test_question_id: { type: integer }
                    earned_score: { type: number, minimum: 0 }
                    teacher_feedback: { type: string }
      responses:
        200:
          description: Manual grades saved (attempt GRADED when no pending answers remain)
  /tests/{test_id}/attempts/{attempt_id}/grading/result:
    get:
      tags: [Grading]
      summary: Get grading result (student or teacher)
      description: |
        If attempt status is SUBMITTED, returns grading_completed=false with a waiting message.
        If GRADED, returns final score, maximum score, percentage (2 decimal places),
        grading summary, and timestamps.
        Access: the student (own attempt), the test creator, subject teachers, or workspace admin.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Grading result payload
          schema:
            type: object
            properties:
              grading_completed: { type: boolean }
              message: { type: string }
              final_score: { type: number }
              maximum_score: { type: number }
              percentage: { type: number }
              grading_summary: { type: object }
              submitted_at: { type: string, format: date-time }
              graded_at: { type: string, format: date-time }
  /student/tests/results:
    get:
      tags: [Grading]
      summary: List graded test results for student dashboard
      description: |
        Returns ONLY fully graded attempts (`TestAttemptStatus=GRADED`) for the authenticated
        student in the current workspace.

        **Strict exclusions:** `SUBMITTED`, `IN_PROGRESS`, draft/archived tests, and other
        students' attempts are never included.

        Sorted by `graded_at` descending, then `submitted_at` as fallback.
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Graded results (JSON array)
          schema:
            type: array
            items:
              $ref: "#/definitions/StudentGradedResult"
        403:
          description: Not an active student
  /student/subjects/{subject_id}/analytics:
    get:
      tags: [Student Exams]
      summary: Subject performance analytics for authenticated student
      description: |
        Topic-based subject analytics computed from already graded attempts only.
        Includes weighted topic performance using difficulty weights:
        EASY=1.0, MEDIUM=1.5, HARD=2.0.

        Excludes in-progress, submitted-only, draft, and ungraded attempts.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Subject analytics
          schema:
            type: object
            properties:
              subject_id: { type: integer }
              subject_name: { type: string }
              overall_performance: { type: number }
              student: { type: object }
              topics:
                type: array
                items:
                  type: object
                  properties:
                    topic_id: { type: integer, nullable: true }
                    topic_name: { type: string }
                    performance: { type: number }
                    classification: { type: string }
                    weighted_earned_points: { type: number }
                    weighted_possible_points: { type: number }
              strengths:
                type: array
                items:
                  type: object
              weaknesses:
                type: array
                items:
                  type: object
        404:
          description: Subject not found or student not enrolled in subject
        403:
          description: Not an active student
  /student/tests/{test_id}/analytics:
    get:
      tags: [Student Exams]
      summary: Topic mastery for one graded test result
      description: |
        Returns topic-level mastery for the student's own graded attempt of this test.
        Uses stored grading scores; does not recalculate grading from scratch.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Test analytics
          schema:
            type: object
            properties:
              test_id: { type: integer }
              test_title: { type: string }
              final_score: { type: number }
              percentage: { type: number }
              attempt_id: { type: integer }
              topics:
                type: array
                items:
                  type: object
                  properties:
                    topic_id: { type: integer, nullable: true }
                    topic_name: { type: string }
                    mastery_percentage: { type: number }
                    classification: { type: string }
                    weighted_earned_points: { type: number }
                    weighted_possible_points: { type: number }
        404:
          description: Graded test result not found
        403:
          description: Not an active student
  /tests/{test_id}/attempts/{attempt_id}/grade:
    post:
      tags: [Grading]
      summary: Manually grade pending answers (legacy alias)
      description: Alias of POST .../grading/manual for backward compatibility.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [answers]
            properties:
              answers:
                type: array
                items:
                  type: object
                  required: [test_question_id, earned_score]
                  properties:
                    test_question_id: { type: integer }
                    earned_score: { type: number, minimum: 0 }
                    teacher_feedback: { type: string }
      responses:
        200:
          description: Manual grades saved
  /tests/{test_id}/attempts/{attempt_id}/force-submit:
    post:
      tags: [Tests]
      summary: Force submit attempt (teacher/admin)
      description: Teacher, workspace owner/admin, or test creator may finalize a student attempt.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Force submitted (submission_source=FORCE)
  /tests/{test_id}/attempts/{attempt_id}/timeout:
    post:
      tags: [Student Exams]
      summary: Finalize attempt on timeout
      description: |
        Called when client timer expires. Also applied automatically when expires_at is reached
        on any attempt read/write. submission_source=TIMEOUT.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Timed out and finalized
  # ── Proctoring — teacher/proctor monitoring ─────────────────────────────
  /tests/{test_id}/proctoring/sessions:
    get:
      tags: [Proctoring]
      summary: List active proctoring sessions for a test
      description: Teacher, admin, or test creator only.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Active proctoring sessions
  /tests/{test_id}/attempts/{attempt_id}/proctoring/session:
    post:
      tags: [Student Exams]
      summary: Start proctoring session
      description: |
        Student only. Also auto-started when attempt begins if test.settings_config.proctoring.enabled is true.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: test_id
          in: path
          type: integer
          required: true
        - name: attempt_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
