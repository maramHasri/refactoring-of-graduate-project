swagger: "2.0"
info:
  title: edu_forms API
  description: Multi-tenant educational assessment platform
  version: "1.0.0"
host: "127.0.0.1:5000"
basePath: /
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT access token. Example: Bearer eyJhbG..."
  WorkspaceId:
    type: apiKey
    name: X-Workspace-Id
    in: header
    description: Active workspace context (not in JWT)
tags:
  - name: Meta
  - name: Auth
  - name: Super Admin
  - name: Super Admin Management
  - name: Workspaces
    description: Workspace management and student subject assignments
  - name: Subjects
  - name: Question banks
  - name: Tests
  - name: Templates
    description: Teacher/admin — create, configure, publish, and manage exams
  - name: Student Exams
    description: Student — available exams, start/resume attempts, autosave answers, submit, and exam-time proctoring
  - name: Proctoring
    description: Teacher/proctor — monitor sessions, review violations, and audit logs
  - name: Reports
    description: User support reports submitted to platform administration
  - name: Grading
    description: Teacher — manual grading and results; students — graded results dashboard and per-attempt grading outcome
  - name: Invites
  - name: Join codes
  - name: Uploads
    description: Reusable file upload services (images, etc.)
paths:
  /:
    get:
      tags: [Meta]
      summary: API entry — links to Swagger and health
      responses:
        200:
          description: Welcome JSON
  /health:
    get:
      tags: [Meta]
      summary: Health check
      responses:
        200:
          description: OK
  /health/db:
    get:
      tags: [Meta]
      summary: Database health
      responses:
        200:
          description: Connected
  /api/enums:
    get:
      tags: [Meta]
      summary: List enum values
      responses:
        200:
          description: Enum reference
  /uploads/images:
    post:
      tags: [Uploads]
      summary: Upload image file
      description: |
        Standalone image upload for reuse across the platform (question banks, tests, etc.).

        **Workflow:** upload the image here first, then pass returned `image_path` to
        question create/update APIs (`POST /question-banks/{bank_id}/questions`, etc.).

        Supported formats: JPG, JPEG, PNG, WEBP. Max size defaults to 5MB.
      consumes: [multipart/form-data]
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: image
          in: formData
          type: file
          required: true
          description: Image file (JPG, JPEG, PNG, WEBP)
      responses:
        201:
          description: Image uploaded
          schema:
            type: object
            properties:
              message: { type: string, example: Image uploaded }
              success: { type: boolean, example: true }
              image_path:
                type: string
                example: questions/1/8/abc123def456.png
                description: Relative path — pass to question APIs as image_path
              file_name:
                type: string
                example: abc123def456.png
              image_url:
                type: string
                example: http://127.0.0.1:5000/uploads/questions/1/8/abc123def456.png
        400:
          description: Validation error (missing file, wrong type, or too large)
  /auth/register:
    post:
      tags: [Auth]
      summary: Register workspace owner
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password, full_name, workspace_name, workspace_kind]
            properties:
              email: { type: string, example: owner@school.com }
              password: { type: string, example: "Password123!" }
              full_name: { type: string, example: "Jane Owner" }
              workspace_name: { type: string, example: "My Academy" }
              workspace_kind: { type: string, enum: [SOLO, INSTITUTION] }
              slug:
                type: string
                x-nullable: true
                description: Optional workspace slug. Not unique across the platform.
              phone_number: { type: string }
              country: { type: string, description: Institution registration }
              city: { type: string }
              website_url: { type: string }
              description: { type: string }
      responses:
        201:
          description: OTP sent; complete registration via POST /auth/verify-otp
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, example: user@example.com }
              password: { type: string, example: "Password123!" }
      responses:
        200:
          description: Tokens + user + memberships
  /auth/superadmin/login:
    post:
      tags: [Super Admin]
      summary: Super admin login (POST only — not GET)
      description: Use Try it out in Swagger. Browser address bar sends GET and returns 405.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, example: superadmin@eduforms.local }
              password: { type: string, example: "SuperAdmin@123" }
      responses:
        200:
          description: Tokens + is_superadmin true
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Logged out
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout all sessions
      security: [{ Bearer: [] }]
      responses:
        200:
          description: All sessions revoked
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [refresh_token]
            properties:
              refresh_token: { type: string }
      responses:
        200:
          description: New tokens
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify email OTP (registration or password reset)
      description: |
        6-digit OTP from email. Expires in 15 minutes (configurable). Max 5 wrong attempts.
        - Registration / account verification: completes signup or marks email verified.
        - Password reset (after POST /auth/forgot-password): validates OTP; then call
          POST /auth/reset-password with email and new_password only.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email, otp]
            properties:
              email: { type: string, format: email, example: owner@school.com }
              otp: { type: string, example: "123456", pattern: "^[0-9]{6}$" }
      responses:
        200:
          description: Verified
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              email_verified: { type: boolean }
              otp_verified: { type: boolean }
              purpose: { type: string, enum: [REGISTER_OWNER, VERIFY_ACCOUNT, RESET_PASSWORD] }
              message: { type: string }
              workspace_status: { type: string }
              requires_admin_approval: { type: boolean }
  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend email OTP
      description: |
        Invalidates previous OTP and sends a new code. Rate limited (resend interval + hourly cap).
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
                example: user@example.com
      responses:
        200:
          description: OTP sent
          schema:
            type: object
            properties:
              success: { type: boolean }
              email_sent: { type: boolean }
              dev_otp:
                type: string
                description: Only in development if Gmail fails
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Start password reset (6-digit OTP)
      parameters:
        - in: body
          name: body
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
      responses:
        200:
          description: OTP sent if account exists
          schema:
            type: object
            properties:
              message: { type: string }
              email_sent: { type: boolean }
              dev_otp:
                type: string
                description: Only in development when EXPOSE_OTP_IN_DEV_RESPONSE is enabled
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset (after OTP verified)
      description: |
        Requires a prior successful POST /auth/verify-otp for the same email
        (password-reset OTP from POST /auth/forgot-password).
      parameters:
        - in: body
          name: body
          schema:
            type: object
            required: [email, new_password]
            properties:
              email: { type: string, format: email }
              new_password: { type: string, minLength: 8 }
      responses:
        200:
          description: Password reset
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      security: [{ Bearer: [] }]
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              current_password: { type: string }
              new_password: { type: string }
      responses:
        200:
          description: Changed
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: Returns the authenticated user's profile. User is resolved from JWT only.
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Profile
          schema:
            $ref: "#/definitions/UserProfile"
    patch:
      tags: [Users]
      summary: Update current user profile
      description: |
        Update `full_name`, `phone_number`, and/or `avatar_url` only.
        `avatar_url` is the URL returned from the upload API (not a file upload).
        `email` and other internal fields cannot be changed (unknown fields return 400).
      security: [{ Bearer: [] }]
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              full_name: { type: string, example: "Ahmed Ali" }
              phone_number: { type: string, example: "+9639xxxxxxx" }
              avatar_url:
                type: string
                example: "https://cdn.example.com/avatars/user123.png"
      responses:
        200:
          description: Profile updated
          schema:
            type: object
            properties:
              message: { type: string, example: "Profile updated successfully" }
              user:
                $ref: "#/definitions/UserProfile"
    delete:
      tags: [Users]
      summary: Soft-delete current user account
      description: |
        Soft-deletes the authenticated user's account by setting `deleted_at`.
        Related data (tests, attempts, results, memberships, topics, audit/proctoring)
        is retained. Active sessions are revoked.
        Distinct from suspension (`SUSPENDED`) and disable (`DISABLED`).
        A SUPER_ADMIN may restore the account within one calendar month
        (application timezone) via `POST /api/super-admin/users/{user_id}/restore`.
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Account soft-deleted
          schema:
            type: object
            properties:
              message: { type: string, example: "Account deleted successfully" }
              deleted_at: { type: string, format: date-time }
        401:
          description: Missing or invalid access token
        403:
          description: Account already deleted (or blocked for other reasons)
        409:
          description: Account is already deleted
  /users/{user_id}/memberships:
    get:
      tags: [Users]
      summary: List memberships for a user
      description: |
        Returns every workspace membership belonging to the given user.
        Accessible by the user themselves or by a platform super admin
        (same audience that may view that user's details).
        An empty `memberships` array is a successful response when the user has none.
      security: [{ Bearer: [] }]
      parameters:
        - in: path
          name: user_id
          type: integer
          required: true
          description: Target user id
      responses:
        200:
          description: User memberships
          schema:
            $ref: "#/definitions/UserMembershipsResponse"
        401:
          description: Missing or invalid access token
          schema:
            type: object
            properties:
              error: { type: string }
        403:
          description: Caller cannot view this user's memberships
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Insufficient permissions to view this user's memberships"
        404:
          description: User not found
          schema:
            type: object
            properties:
              error:
                type: string
                example: "User not found"
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List accessible workspaces
      security: [{ Bearer: [] }]
      responses:
        200:
          description: Workspace list
    post:
      tags: [Workspaces]
      summary: Create workspace
      security: [{ Bearer: [] }]
      parameters:
        - in: body
          name: body
          schema:
            type: object
            required: [name, kind]
            properties:
              name: { type: string }
              kind: { type: string, enum: [SOLO, INSTITUTION] }
              slug:
                type: string
                x-nullable: true
                description: Optional. Not unique. When omitted, derived from name.
              logo_url: { type: string, example: "https://cdn.example.com/logos/school.png" }
              description: { type: string, example: "Independent teacher workspace" }
      responses:
        201:
          description: Created
  /workspaces/teachers:
    get:
      tags: [Workspaces]
      summary: List institution workspace teachers
      description: |
        Returns active members with role TEACHER in the workspace selected via X-Workspace-Id.
        Institution workspaces only. Caller must be workspace owner or ADMIN.
        Teachers and students receive 403.
        Supports optional `search` (full_name, email), `page`, and `per_page`.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: search
          in: query
          type: string
          required: false
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Teacher list
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              count: { type: integer, description: "Items in current page" }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
              teachers:
                type: array
                items:
                  $ref: "#/definitions/WorkspaceTeacherMember"
              data:
                type: array
                description: Backward-compatible alias of teachers
                items:
                  $ref: "#/definitions/WorkspaceTeacherMember"
        403:
          description: Forbidden (not owner/admin, or not an institution workspace)
    delete:
      tags: [Workspaces]
      summary: Remove teacher from institution workspace
      description: |
        Removes a TEACHER membership from the workspace selected via X-Workspace-Id.
        Institution workspaces only. Caller must be workspace owner or ADMIN.

        **Swagger:** run `GET /workspaces/teachers` first, copy `membership_id` from a teacher
        row, then pass it as the query parameter below.

        Cleans up teacher subject assignments in this workspace, then deletes the membership.
        Does not delete the user account or memberships in other workspaces.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: membership_id
          in: query
          type: integer
          required: true
          example: 45
          description: Workspace membership id of the teacher (from GET /workspaces/teachers)
      responses:
        200:
          description: Teacher removed
          schema:
            type: object
            properties:
              message:
                type: string
                example: Teacher removed from workspace successfully.
        403:
          description: Forbidden (not owner/admin, cannot remove owner)
        404:
          description: Membership not found in this workspace
        422:
          description: Membership is not a teacher or not active
  /workspaces/dashboard:
    get:
      tags: [Workspaces]
      summary: Workspace admin dashboard
      description: |
        Returns an overview for the Workspace Admin Dashboard for the workspace
        selected via X-Workspace-Id.

        **Authorization:** INSTITUTION or SOLO workspaces. Caller must be the
        workspace owner or a workspace ADMIN (same authority model as member
        management). Students and ordinary teachers without admin authority
        receive 403.

        **Overview metrics:**
        - Member counts include only `Membership.status=ACTIVE` users with
          `User.deleted_at IS NULL` (ADMIN + TEACHER + STUDENT).
          In SOLO workspaces the owner is typically counted under `total_admins`.
        - `total_subjects` counts non-deleted subjects in the workspace.
        - `average_student_score` is the mean of graded attempt `percentage` values
          for tests created in this workspace (same metric as student analytics).
        - `most_enrolled_subject` counts active student subject enrollments.

        **Recent question banks:** ordered by `updated_at` (create/modify activity;
        there is no separate last-used timestamp), with ACTIVE `question_count`.

        **Upcoming tests:** SCHEDULED/PUBLISHED, not archived, not past `closed_at`,
        and still relevant by start/availability rules (workspace-wide, not
        student-personal upcoming).

        **Performance trend:** daily mean of graded attempt percentages over the
        last 30 days (`COALESCE(graded_at, submitted_at)`). Empty days are omitted.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: recent_limit
          in: query
          type: integer
          default: 5
          description: Max items for recent subjects, members, and question banks (1-20)
        - name: upcoming_limit
          in: query
          type: integer
          default: 10
          description: Max upcoming tests (1-50)
      responses:
        200:
          description: Institution dashboard payload
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              overview:
                type: object
                properties:
                  total_members: { type: integer }
                  total_teachers: { type: integer }
                  total_students: { type: integer }
                  total_admins: { type: integer }
                  total_subjects: { type: integer, description: "Non-deleted subjects in the institution" }
                  average_student_score: { type: number, example: 78.5 }
                  most_enrolled_subject:
                    type: object
                    x-nullable: true
                    properties:
                      subject_id: { type: integer }
                      name: { type: string }
                      student_count: { type: integer }
              recent_subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    name: { type: string }
                    created_at: { type: string }
                    student_count: { type: integer }
              recent_members:
                type: array
                items:
                  type: object
                  properties:
                    user_id: { type: integer }
                    membership_id: { type: integer }
                    full_name: { type: string }
                    role: { type: string, enum: [ADMIN, TEACHER, STUDENT] }
                    joined_at: { type: string }
                    avatar_url: { type: string, x-nullable: true }
                    profile_image_url: { type: string, x-nullable: true }
              recent_question_banks:
                type: array
                items:
                  type: object
                  properties:
                    bank_id: { type: integer }
                    title: { type: string }
                    updated_at: { type: string }
                    activity_source: { type: string, example: UPDATED }
                    question_count: { type: integer, example: 42 }
              upcoming_tests:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    name: { type: string }
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    exam_date:
                      type: string
                      example: "2026-07-30"
                      description: Alias of starts_at_date (from starts_at only)
                    exam_time:
                      type: string
                      example: "09:30"
                      description: Alias of starts_at_time (from starts_at only)
                    starts_at: { type: string, description: "Full local start datetime" }
                    starts_at_date:
                      type: string
                      example: "2026-07-30"
                      description: Calendar date part of starts_at (YYYY-MM-DD)
                    starts_at_time:
                      type: string
                      example: "09:30"
                      description: Clock time part of starts_at (HH:MM)
                    closed_at: { type: string }
                    scheduled_publish_at: { type: string }
                    status: { type: string }
                    availability_time_mode: { type: string }
              performance_trend:
                type: object
                properties:
                  period: { type: string, example: LAST_30_DAYS }
                  metric: { type: string, example: percentage }
                  aggregation: { type: string, example: daily_mean_of_graded_attempts }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, example: "2026-07-01" }
                        average_score: { type: number }
                        graded_attempts: { type: integer }
        403:
          description: Forbidden (not workspace owner/admin, or unsupported workspace kind)
        404:
          description: Workspace not found
  /workspaces/analytics:
    get:
      tags: [Workspaces]
      summary: Institution Analytics Dashboard
      description: |
        Full Institution Analytics Dashboard for the workspace selected via
        `X-Workspace-Id`.

        **Authorization:** INSTITUTION workspaces only. Caller must be the
        workspace owner (`owner_membership_id`). Teachers, students, non-owner
        admins, and Super Admin (without owner membership) receive 403.

        **Scope:** All metrics are confined to the current workspace. Academic
        attempt metrics filter on `TestAttempt.graded_at` (GRADED attempts,
        mean of `percentage`).

        **Filters (all optional):**
        - `date_from` / `date_to` — default last 30 days when omitted
        - `subject_id` — limit to one subject in this workspace
        - `teacher_membership_id` — limit to tests created by that teacher

        Overview cards include `change_percentage` vs the immediately preceding
        equal-length window.

        **Most Engaged Subjects** activity score =
        `0.6 * students_count + 0.2 * teachers_count + 0.2 * tests_count`.

        **Problematic exams** composite rank uses average proctoring risk %
        (same formula as `ProctoringRiskService`) + violations count +
        `integrity_reports_count` where integrity reports are attempts with
        `submission_source=PROCTORING_AUTO` (there is no separate persisted
        Proctoring Report table; Support `Report` rows are not used).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: date_from
          in: query
          type: string
          format: date-time
          required: false
          description: Start of graded_at window (local naive ISO). Default now-30d.
        - name: date_to
          in: query
          type: string
          format: date-time
          required: false
          description: End of graded_at window (local naive ISO). Default now.
        - name: subject_id
          in: query
          type: integer
          required: false
        - name: teacher_membership_id
          in: query
          type: integer
          required: false
      responses:
        200:
          description: Institution analytics payload
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              filters:
                type: object
                properties:
                  date_from: { type: string }
                  date_to: { type: string }
                  subject_id: { type: integer, x-nullable: true }
                  teacher_membership_id: { type: integer, x-nullable: true }
              overview:
                type: object
                properties:
                  total_students:
                    type: object
                    properties:
                      value: { type: integer }
                      change_percentage: { type: number }
                  total_teachers:
                    type: object
                    properties:
                      value: { type: integer }
                      change_percentage: { type: number }
                  total_tests:
                    type: object
                    properties:
                      value: { type: integer }
                      change_percentage: { type: number }
                  total_attempts:
                    type: object
                    properties:
                      value: { type: integer }
                      change_percentage: { type: number }
                  institution_average_score:
                    type: object
                    properties:
                      value: { type: number }
                      change_percentage: { type: number }
                  active_students:
                    type: object
                    properties:
                      value: { type: integer }
                      change_percentage: { type: number }
              pass_fail:
                type: object
                properties:
                  pass_rate: { type: number }
                  fail_rate: { type: number }
                  passed_attempts: { type: integer }
                  failed_attempts: { type: integer }
              monthly_average_scores:
                type: array
                items:
                  type: object
                  properties:
                    period: { type: string, example: "2026-01" }
                    average_score: { type: number }
              most_engaged_subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    students_count: { type: integer }
                    teachers_count: { type: integer }
                    tests_count: { type: integer }
                    average_score: { type: number, x-nullable: true }
                    activity_score: { type: number }
              best_subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    average_score: { type: number }
                    attempt_count: { type: integer }
              weakest_subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    average_score: { type: number }
                    attempt_count: { type: integer }
              teacher_activity:
                type: array
                items:
                  type: object
                  properties:
                    teacher_membership_id: { type: integer }
                    teacher_name: { type: string }
                    tests_created: { type: integer }
                    targeted_students: { type: integer }
                    average_student_score: { type: number, x-nullable: true }
                    completion_rate: { type: number }
              top_students:
                type: array
                items:
                  type: object
                  properties:
                    student_membership_id: { type: integer }
                    student_name: { type: string }
                    average_score: { type: number }
                    completed_tests: { type: integer }
                    profile_image: { type: string, x-nullable: true }
              inactive_students:
                type: array
                items:
                  type: object
                  properties:
                    student_membership_id: { type: integer }
                    student_name: { type: string }
                    days_inactive: { type: integer }
                    last_activity_at: { type: string, x-nullable: true }
              problematic_exams:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    test_name: { type: string }
                    subject_name: { type: string, x-nullable: true }
                    risk_percentage: { type: number }
                    violations_count: { type: integer }
                    integrity_reports_count: { type: integer }
                    average_score: { type: number, x-nullable: true }
        403:
          description: Forbidden (not institution workspace owner)
        404:
          description: Workspace not found
        422:
          description: Invalid filters (date range, subject, or teacher)
  /workspaces/teacher-dashboard:
    get:
      tags: [Workspaces]
      summary: Teacher-scoped workspace dashboard
      description: |
        Returns a teacher dashboard scoped to subjects the caller teaches
        (or all workspace subjects for owner/ADMIN via `can_manage_subjects`).

        **Authorization:** INSTITUTION or SOLO. Assigned TEACHER, or workspace
        owner/ADMIN. Students without teacher/admin authority receive 403.

        **Scope:** Teacher → active TEACHER subject assignments → active student
        enrollments and GRADED analytics for those subjects only.

        **Metrics:**
        - `summary.total_students`: COUNT(DISTINCT) active STUDENT enrollments
          across the teacher's subjects.
        - `summary.average_performance`: mean of GRADED attempt `percentage`
          values (attempt-weighted), e.g. (80+90+60)/3.
        - `subjects[].students_enrolled`: active STUDENT SubjectMemberships for
          that subject (`status=ACTIVE`, `deleted_at IS NULL`).
        - `subjects[].graded_tests_count`: DISTINCT PUBLISHED, non-archived tests
          with ≥1 GRADED attempt (not attempt count).
        - `subjects[].average_performance`: mean GRADED attempt percentage for
          the subject.
        - `subjects[].success_rate`: passed graded attempts / total graded × 100
          using `final_score >= passing_score`.
        - `weak_topics`: cohort difficulty-weighted mastery below system thresholds
          (same `_classify` rules as student analytics), with
          `mastery_percentage`, `attempts_count`, and `students_affected`.

        **Upcoming tests:** SCHEDULED/PUBLISHED tests in teacher subjects only
        (not student-personal upcoming, not full-workspace admin upcoming).

        **Recent tests:** most recently created by the caller's membership
        (`created_by_membership_id`), not all subject tests.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: recent_limit
          in: query
          type: integer
          default: 5
          description: Max recently created tests (1-20)
        - name: upcoming_limit
          in: query
          type: integer
          default: 10
          description: Max upcoming tests (1-50)
      responses:
        200:
          description: Teacher dashboard payload
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              summary:
                type: object
                properties:
                  average_performance: { type: number, example: 76.67 }
                  total_students: { type: integer, example: 42 }
                  weak_topics:
                    type: array
                    items:
                      $ref: "#/definitions/TeacherDashboardWeakTopic"
              subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    students_enrolled: { type: integer }
                    students_count: { type: integer, description: Alias of students_enrolled }
                    graded_tests_count:
                      type: integer
                      description: Distinct tests with ≥1 GRADED attempt
                    average_performance: { type: number, example: 82.4 }
                    success_rate: { type: number, example: 70.0 }
                    weak_topics:
                      type: array
                      items:
                        $ref: "#/definitions/TeacherDashboardWeakTopic"
              upcoming_tests:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    title: { type: string }
                    name: { type: string }
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    starts_at: { type: string }
                    starts_at_date: { type: string, example: "2026-07-30" }
                    starts_at_time: { type: string, example: "09:30" }
                    ends_at: { type: string }
                    closed_at: { type: string }
                    status: { type: string }
                    availability_time_mode: { type: string }
              recent_tests:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    title: { type: string }
                    name: { type: string }
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    status: { type: string }
                    created_at: { type: string }
                    published_at: { type: string }
        403:
          description: Forbidden (not teacher/admin, or unsupported workspace kind)
        404:
          description: Workspace not found
  /workspaces/tests:
    get:
      tags: [Workspaces]
      summary: List all exams in an institution workspace
      description: |
        Returns every test/exam created by members (typically teachers) inside the
        institution workspace selected via X-Workspace-Id.

        Institution workspaces only. Caller must be the **workspace owner**
        (ADMIN alone is not enough). Supports optional `status`, `page`, and `per_page`.

        Each test includes exam-card stats: `participants_count`, `average_score`
        (GRADED final_score with raw_score fallback), `graded_attempts_count`,
        `submitted_attempts_count`, and `questions_count` (TestQuestion rows).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: status
          in: query
          type: string
          required: false
          enum: [DRAFT, SCHEDULED, PUBLISHED, CLOSED, ARCHIVED]
          description: Optional filter by test lifecycle status
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Institution workspace exam list
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              count: { type: integer, description: "Items in current page" }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
              tests:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    name: { type: string }
                    slug: { type: string }
                    description: { type: string }
                    subject_id: { type: integer }
                    subject_name: { type: string }
                    status:
                      type: string
                      enum: [DRAFT, SCHEDULED, PUBLISHED, CLOSED, ARCHIVED]
                    total_score: { type: number }
                    passing_score: { type: number }
                    availability_time_mode: { type: string }
                    starts_at: { type: string }
                    duration_minutes: { type: integer }
                    created_by_membership_id: { type: integer }
                    created_by:
                      type: object
                      properties:
                        membership_id: { type: integer }
                        user_id: { type: integer }
                        full_name: { type: string }
                        email: { type: string }
                        role: { type: string }
                    published_at: { type: string }
                    closed_at: { type: string }
                    archived_at: { type: string }
                    created_at: { type: string }
                    updated_at: { type: string }
        403:
          description: Forbidden (not workspace owner, or not an institution workspace)
  /workspaces/groups:
    get:
      tags: [Workspaces, Student Groups]
      summary: List all student groups in the workspace
      description: |
        Returns student groups for the workspace selected via X-Workspace-Id.

        **Authorization:**
        - Workspace owner/ADMIN: all groups across all subjects (monitor mode).
        - TEACHER: only groups they own (`created_by_membership_id`).
        - Students: 403.

        Each item includes subject, creating teacher (`owner_name`),
        `created_at`, member count, and the full `students` list
        (`membership_id`, name, email).
      security: [{ Bearer: [], WorkspaceId: [] }]
      responses:
        200:
          description: Workspace student groups
          schema:
            type: object
            properties:
              count: { type: integer, example: 4 }
              groups:
                type: array
                items:
                  $ref: "#/definitions/StudentGroupWorkspaceItem"
        403:
          description: Caller is not owner/admin/teacher
        404:
          description: Workspace not found
  /workspaces/students:
    get:
      tags: [Workspaces]
      summary: List workspace students
      description: |
        Returns students in the workspace selected via X-Workspace-Id.

        **INSTITUTION:** all active STUDENT memberships, with `enrolled_subjects_count`
        within the institution.

        **SOLO (independent teacher):** students enrolled in at least one subject
        in this workspace, with `enrolled_subjects_count` for subjects in this workspace.

        Caller must be workspace owner or ADMIN. Teachers endpoint remains institution-only.
        Supports optional `search` (full_name, email), `page`, and `per_page`.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: search
          in: query
          type: string
          required: false
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
      responses:
        200:
          description: Student list
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              count: { type: integer }
              total: { type: integer }
              page: { type: integer }
              per_page: { type: integer }
              pages: { type: integer }
              students:
                type: array
                items:
                  $ref: "#/definitions/WorkspaceStudentMember"
        403:
          description: Forbidden (not owner/admin, or not an institution workspace)
    delete:
      tags: [Workspaces]
      summary: Remove student from workspace
      description: |
        Removes a STUDENT membership from the workspace selected via X-Workspace-Id.
        Institution or SOLO workspace. Caller must be workspace owner or ADMIN.

        **Swagger:** run `GET /workspaces/students` first, copy `membership_id` from a student
        row, then pass it as the query parameter below.

        Cleans up subject enrollments, student group memberships, and test assignments
        in this workspace, then deletes the membership.
        Does not delete the user account or memberships in other workspaces.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: membership_id
          in: query
          type: integer
          required: true
          example: 45
          description: Workspace membership id of the student (from GET /workspaces/students)
      responses:
        200:
          description: Student removed
          schema:
            type: object
            properties:
              message:
                type: string
                example: Student removed from workspace successfully.
        403:
          description: Forbidden (not owner/admin, cannot remove owner)
        404:
          description: Membership not found in this workspace
        422:
          description: Membership is not a student or not active
  /workspaces/members/recently-active:
    get:
      tags: [Workspaces]
      summary: List recently active workspace members
      description: |
        Returns students and/or teachers in the workspace selected via `X-Workspace-Id`
        who were active within the last 24 hours.

        Supports **INSTITUTION** and **SOLO** workspaces. SOLO is an independent teacher
        workspace; the owner is treated as the workspace administrator.

        Activity is derived from `TestAttempt.last_activity_at` in this workspace, falling back to
        `User.last_login_at`. Caller must be workspace owner or ADMIN.

        Optional `role` query parameter filters to `STUDENT` or `TEACHER`. When omitted, both
        roles are returned (ADMIN memberships are excluded).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: role
          in: query
          type: string
          required: false
          enum: [STUDENT, TEACHER]
          description: Filter by workspace membership role
      responses:
        200:
          description: Recently active members
          schema:
            type: object
            properties:
              members:
                type: array
                items:
                  type: object
                  properties:
                    membership_id: { type: integer, example: 45 }
                    user_id: { type: integer, example: 14 }
                    full_name: { type: string, example: "Ahmed Ali" }
                    email: { type: string, example: "ahmed@example.com" }
                    avatar: { type: string, example: "https://cdn.example.com/avatars/user123.png" }
                    role: { type: string, enum: [STUDENT, TEACHER], example: STUDENT }
                    status: { type: string, example: ACTIVE }
                    last_activity_at: { type: string, format: date-time }
        403:
          description: Forbidden (not owner/admin, or unsupported workspace type)
  /workspaces/members/{membership_id}:
    get:
      tags: [Workspaces]
      summary: Get workspace member details
      description: |
        Returns detail for a **STUDENT** or **TEACHER** member in the workspace
        selected via `X-Workspace-Id`. Role is determined from the membership record.

        Supports **INSTITUTION** and **SOLO** workspaces. SOLO is an independent teacher
        workspace; the owner is treated as the workspace administrator.

        Caller must be workspace owner or ADMIN. Membership must belong to the
        current workspace.

        **Student response:** `student`, `subjects`, `upcoming_tests`, `completed_tests`.

        **Teacher response:** `teacher`, `subjects`, `statistics` (question banks and tests created).
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: membership_id
          in: path
          type: integer
          required: true
          example: 45
          description: Workspace membership id (from GET /workspaces/teachers or /workspaces/students)
      responses:
        200:
          description: Member details (student or teacher shape)
          schema:
            type: object
            properties:
              student:
                type: object
                description: Present when membership role is STUDENT
                properties:
                  user_id: { type: integer }
                  full_name: { type: string }
                  email: { type: string }
                  avatar: { type: string }
                  last_activity_at: { type: string, format: date-time }
                  status: { type: string, example: ACTIVE }
              teacher:
                type: object
                description: Present when membership role is TEACHER
                properties:
                  user_id: { type: integer }
                  full_name: { type: string }
                  email: { type: string }
                  avatar: { type: string }
                  last_activity_at: { type: string, format: date-time }
                  status: { type: string, example: ACTIVE }
              subjects:
                type: array
                items:
                  type: object
                  properties:
                    subject_id: { type: integer }
                    subject_name: { type: string }
              upcoming_tests:
                type: array
                description: Student only
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    test_name: { type: string }
                    subject_name: { type: string }
                    availability_type: { type: string, enum: [FLEXIBLE, SCHEDULED] }
                    starts_at: { type: string, format: date-time }
                    duration_minutes: { type: integer }
              completed_tests:
                type: array
                description: Student only
                items:
                  type: object
                  properties:
                    test_id: { type: integer }
                    test_name: { type: string }
                    test_type: { type: string, enum: [FLEXIBLE, SCHEDULED] }
                    test_date: { type: string, format: date }
                    test_start_time: { type: string, format: date-time }
                    subject_name: { type: string }
                    duration_minutes: { type: integer }
              statistics:
                type: object
                description: Teacher only
                properties:
                  question_banks_created: { type: integer }
                  tests_created: { type: integer }
        403:
          description: Forbidden (not owner/admin, or unsupported workspace type)
        404:
          description: Membership not found in this workspace
        422:
          description: Membership is not a student or teacher
    patch:
      tags: [Workspaces]
      summary: Update workspace member profile
      description: |
        Updates editable **User** profile fields for a workspace member identified by `membership_id`.
        Requires `X-Workspace-Id`. Caller must be workspace owner or ADMIN.

        Applies to any active member role (TEACHER, STUDENT, ADMIN) in the current workspace.
        Only updates linked User fields; does **not** change `membership_id`, `workspace_id`, `role`, or `user_id`.

        **Swagger:** run `GET /workspaces/teachers` or `GET /workspaces/students`, copy `membership_id`,
        then call this endpoint with that id in the path.

        Editable fields: `full_name`, `phone_number`, `avatar_url` (stored as `profile_image_url`).
        Email is read-only and cannot be changed via this endpoint.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: membership_id
          in: path
          type: integer
          required: true
          example: 45
          description: Workspace membership id (from teachers/students list)
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              full_name: { type: string, example: "Ahmed Ali" }
              phone_number: { type: string, example: "+9639xxxxxxx" }
              avatar_url: { type: string, example: "https://cdn.example.com/avatars/user123.png" }
      responses:
        200:
          description: Member updated
          schema:
            type: object
            properties:
              message:
                type: string
                example: Workspace member updated successfully
              member:
                type: object
                description: Same shape as teacher/student list items
                properties:
                  user_id: { type: integer, example: 14 }
                  membership_id: { type: integer, example: 45 }
                  full_name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "ahmed@example.com" }
                  avatar_url: { type: string }
                  user_status: { type: string, example: ACTIVE }
                  workspace_role: { type: string, example: TEACHER }
                  membership_role: { type: string, example: TEACHER }
                  assigned_subjects_count: { type: integer, example: 4 }
                  enrolled_subjects_count: { type: integer, example: 5 }
                  created_at: { type: string, format: date-time }
        403:
          description: Forbidden (not owner/admin)
        404:
          description: Membership or user not found in this workspace
        422:
          description: Validation error (empty body, inactive membership, invalid field)
  /workspaces/{workspace_id}:
    get:
      tags: [Workspaces]
      summary: Get workspace
      security: [{ Bearer: [] }]
      parameters:
        - name: workspace_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Workspace detail
    patch:
      tags: [Workspaces]
      summary: Update workspace
      security: [{ Bearer: [] }]
      parameters:
        - name: workspace_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          schema:
            type: object
            properties:
              name: { type: string }
              slug:
                type: string
                x-nullable: true
                description: Optional. Not unique across workspaces.
              logo_url: { type: string, example: "https://cdn.example.com/logos/school.png" }
              description: { type: string, example: "Independent teacher workspace" }
      responses:
        200:
          description: Updated
    delete:
      tags: [Workspaces]
      summary: Delete workspace (owner only)
      security: [{ Bearer: [] }]
      parameters:
        - name: workspace_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Deleted
  /student-memberships/subjects:
    post:
      tags: [Workspaces]
