  /student-memberships/{membership_id}/subjects/{subject_id}:
    delete:
      tags: [Workspaces]
      operationId: removeStudentSubject
      summary: Remove one subject from student
      description: Soft-remove one subject assignment. Owner or ADMIN only.
      security: [{ Bearer: [], WorkspaceId: [] }]
      parameters:
        - name: membership_id
          in: path
          type: integer
          required: true
        - name: subject_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Subject removed
        403:
          description: Forbidden
        404:
          description: Not found
  /subjects:
    get:
      tags: [Subjects]
      summary: List workspace subjects
      description: |
        Admin/owner see all. Teachers/students see assigned subjects only.
        Requires X-Workspace-Id. Each subject includes `teachers` (assigned
        subject teachers with `full_name` / `membership_id`), `teachers_count`,
        `question_banks_count` (non-deleted banks), and `tests_count`
