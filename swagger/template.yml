                  organization_admins: { type: integer, example: 120 }
                  super_admins: { type: integer, example: 3 }
                  active_today: { type: integer, example: 310 }
                  active_week: { type: integer, example: 1420 }
                  active_month: { type: integer, example: 3180 }
                  new_this_month: { type: integer, example: 260 }
              organizations:
                type: object
                properties:
                  total: { type: integer, example: 48 }
                  active: { type: integer, example: 44 }
                  suspended: { type: integer, example: 2 }
                  new_this_month: { type: integer, example: 4 }
                  most_active:
                    type: array
                    items:
                      type: object
                      properties:
                        organization_id: { type: integer, example: 6 }
                        organization_name: { type: string, example: "AYAAHT Academy" }
                        active_users: { type: integer, example: 120 }
                        tests_count: { type: integer, example: 35 }
                        attempts_count: { type: integer, example: 450 }
              content:
                type: object
                properties:
                  subjects: { type: integer, example: 220 }
                  topics: { type: integer, example: 1450 }
                  questions: { type: integer, example: 31200 }
                  tests: { type: integer, example: 5800 }
              tests:
                type: object
                properties:
                  total_tests: { type: integer, example: 5800 }
                  total_attempts: { type: integer, example: 102000 }
                  attempts_today: { type: integer, example: 1400 }
                  attempts_week: { type: integer, example: 9300 }
                  attempts_month: { type: integer, example: 37600 }
                  average_score: { type: number, example: 74.3 }
              reports:
                type: object
                properties:
                  total: { type: integer, example: 980 }
                  pending: { type: integer, example: 120 }
                  under_review: { type: integer, example: 210 }
                  resolved: { type: integer, example: 520 }
                  rejected: { type: integer, example: 130 }
        403:
          description: Super admin access required
        401:
          description: Missing or invalid token
  /api/super-admin/organizations/{organization_id}/suspend:
    patch:
      tags: [Super Admin Management]
      summary: Suspend an organization
      description: |
        Suspends a workspace organization (SOLO or INSTITUTION). Data and memberships are preserved.
        Sets workspace status to SUSPENDED and records suspension metadata.
        Suspended organizations are excluded from active workspace access and login workspace selection.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
          description: Workspace id (`workspaces.kind` is SOLO or INSTITUTION)
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                example: "Violation of platform policies"
      responses:
        200:
          description: Organization suspended
          schema:
            type: object
            properties:
              message: { type: string, example: "Organization suspended successfully" }
              organization:
                type: object
                properties:
                  id: { type: integer, example: 1 }
                  name: { type: string, example: "ABC Academy" }
                  organization_type: { type: string, example: INSTITUTION }
                  status: { type: string, example: SUSPENDED }
                  suspended_at: { type: string, format: date-time }
                  suspension_reason: { type: string, example: "Violation of platform policies" }
                  students_count: { type: integer, example: 500 }
                  teachers_count: { type: integer, example: 35 }
                  tests_count: { type: integer, example: 120 }
        404:
          description: Organization not found
        409:
          description: Organization is already suspended
        422:
          description: Validation error
        403:
          description: Super admin access required
  /api/super-admin/organizations/{organization_id}/restore:
    post:
      tags: [Super Admin Management]
      summary: Restore a suspended organization
      description: |
        Restores a previously suspended workspace organization (SOLO or INSTITUTION).
        Sets status to ACTIVE and clears suspension metadata.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Organization restored
          schema:
            type: object
            properties:
              message: { type: string, example: "Organization restored successfully" }
              organization:
                type: object
                properties:
                  id: { type: integer, example: 1 }
                  name: { type: string, example: "ABC Academy" }
                  organization_type: { type: string, example: INSTITUTION }
                  status: { type: string, example: ACTIVE }
                  students_count: { type: integer, example: 500 }
                  teachers_count: { type: integer, example: 35 }
                  admins_count: { type: integer, example: 3 }
                  tests_count: { type: integer, example: 120 }
                  attempts_count: { type: integer, example: 5400 }
        404:
          description: Organization not found
        422:
          description: Organization is not suspended
        403:
          description: Super admin access required
  /api/super-admin/organizations/{organization_id}:
    get:
      tags: [Super Admin Management]
      summary: Get organization details
      description: |
        Complete management view for a specific workspace organization (SOLO or INSTITUTION).
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: organization_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: Organization details
          schema:
            type: object
            properties:
              id: { type: integer, example: 1 }
              name: { type: string, example: "ABC Academy" }
              slug: { type: string, example: "abc-academy" }
              organization_type: { type: string, example: INSTITUTION }
              status: { type: string, example: ACTIVE }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              suspended_at: { type: string, format: date-time }
              suspension_reason: { type: string }
              is_verified_by_superadmin: { type: boolean, example: true }
              owner:
                type: object
                properties:
                  user_id: { type: integer, example: 5 }
                  name: { type: string, example: "Owner Name" }
                  email: { type: string, example: "owner@abc.edu" }
              admins_count: { type: integer, example: 3 }
              students_count: { type: integer, example: 500 }
              teachers_count: { type: integer, example: 35 }
              active_users_count: { type: integer, example: 538 }
              tests_count: { type: integer, example: 120 }
              attempts_count: { type: integer, example: 5400 }
        404:
          description: Organization not found
        403:
          description: Super admin access required
  /api/super-admin/users/{user_id}/suspend:
    patch:
      tags: [Super Admin Management]
      summary: Suspend a user account
      description: |
        Suspends a user account without deleting data or memberships.
        Sets user status to SUSPENDED, records suspension metadata, and revokes active sessions.
        Super admins cannot suspend their own account.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                example: "Repeated policy violations"
      responses:
        200:
          description: User suspended
          schema:
            type: object
            properties:
              message: { type: string, example: "User suspended successfully" }
              user:
                type: object
                properties:
                  id: { type: integer, example: 15 }
                  name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "user@example.com" }
                  status: { type: string, example: SUSPENDED }
                  suspended_at: { type: string, format: date-time }
                  suspension_reason: { type: string, example: "Repeated policy violations" }
                  roles:
                    type: array
                    items: { type: string }
                    example: [TEACHER]
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 2 }
                        name: { type: string, example: "ABC Academy" }
                        organization_type: { type: string, example: INSTITUTION }
                        status: { type: string, example: ACTIVE }
        403:
          description: Forbidden (e.g. self-suspension)
        404:
          description: User not found
        409:
          description: User is already suspended
        422:
          description: Validation error
  /api/super-admin/users/{user_id}/restore:
    post:
      tags: [Super Admin Management]
      summary: Restore a suspended user
      description: |
        Restores a previously suspended user account.
        Sets status to ACTIVE and clears suspension metadata.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: User restored
          schema:
            type: object
            properties:
              message: { type: string, example: "User restored successfully" }
              user:
                type: object
                properties:
                  id: { type: integer, example: 15 }
                  name: { type: string, example: "Ahmed Ali" }
                  email: { type: string, example: "user@example.com" }
                  status: { type: string, example: ACTIVE }
                  roles:
                    type: array
                    items: { type: string }
                    example: [TEACHER]
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 2 }
                        name: { type: string, example: "ABC Academy" }
                        organization_type: { type: string, example: INSTITUTION }
                        status: { type: string, example: ACTIVE }
        404:
          description: User not found
        422:
          description: User is not suspended
        403:
          description: Super admin access required
  /api/super-admin/users/{user_id}:
    get:
      tags: [Super Admin Management]
      summary: Get user details
      description: |
        Complete management view for a specific user, including memberships and activity stats.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: user_id
          in: path
          type: integer
          required: true
      responses:
        200:
          description: User details
          schema:
            type: object
            properties:
              id: { type: integer, example: 15 }
              name: { type: string, example: "Ahmed Ali" }
              email: { type: string, example: "user@example.com" }
              status: { type: string, example: ACTIVE }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              last_login_at: { type: string, format: date-time }
              last_activity_at: { type: string, format: date-time }
              email_verified: { type: boolean, example: true }
              is_superadmin: { type: boolean, example: false }
              suspended_at: { type: string, format: date-time }
              suspension_reason: { type: string }
              roles:
                type: array
                items: { type: string }
                example: [TEACHER]
              organizations:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 2 }
                    name: { type: string, example: "ABC Academy" }
                    organization_type: { type: string, example: INSTITUTION }
                    status: { type: string, example: ACTIVE }
              memberships:
                type: array
                items:
                  type: object
                  properties:
                    membership_id: { type: integer, example: 42 }
                    role: { type: string, example: TEACHER }
                    status: { type: string, example: ACTIVE }
                    joined_at: { type: string, format: date-time }
              created_tests_count: { type: integer, example: 12 }
              completed_attempts_count: { type: integer, example: 48 }
        404:
          description: User not found
        403:
          description: Super admin access required
  /api/super-admin/users:
    get:
      tags: [Super Admin Management]
      summary: List all platform users with memberships and roles
      description: |
        Platform-wide user listing for Super Admin user management.
        Supports pagination and filtering by role, organization, status, and search.
        Super Admin only.
      security: [{ Bearer: [] }]
      parameters:
        - name: page
          in: query
          type: integer
          default: 1
        - name: per_page
          in: query
          type: integer
          default: 20
        - name: role
          in: query
          type: string
          enum: [ADMIN, TEACHER, STUDENT, SUPER_ADMIN]
        - name: organization_id
          in: query
          type: integer
          description: Filter users by organization workspace id
        - name: status
          in: query
          type: string
          enum: [PENDING_VERIFICATION, PENDING_APPROVAL, REGISTRATION_REJECTED, ACTIVE, SUSPENDED, DISABLED]
        - name: search
          in: query
          type: string
          description: Search by user name or email
      responses:
        200:
          description: Paginated user list
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, example: 15 }
                    name: { type: string, example: "Ahmed Ali" }
                    email: { type: string, example: "user@example.com" }
                    status: { type: string, example: ACTIVE }
                    created_at: { type: string, format: date-time }
                    suspended_at: { type: string, format: date-time }
                    suspension_reason: { type: string }
                    roles:
                      type: array
                      items: { type: string }
                      example: [TEACHER]
                    organizations:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer, example: 2 }
                          name: { type: string, example: "ABC Academy" }
                          organization_type: { type: string, example: INSTITUTION }
                          status: { type: string, example: ACTIVE }
              total: { type: integer, example: 120 }
              page: { type: integer, example: 1 }
              per_page: { type: integer, example: 20 }
              pages: { type: integer, example: 6 }
        403:
          description: Super admin access required

definitions:
  TopicSummary:
    type: object
    properties:
      id: { type: integer, example: 10 }
      name: { type: string, example: "Algebra" }
  Topic:
    type: object
    properties:
      id: { type: integer }
      name: { type: string, example: "Algebra" }
      description: { type: string, example: "Basic algebra concepts" }
      subject_id: { type: integer }
      workspace_id: { type: integer }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  StudentGroupSummary:
    type: object
    properties:
      id: { type: integer, example: 5 }
      name: { type: string, example: "Section A" }
      description: { type: string, example: "Morning students" }
      student_count: { type: integer, example: 18 }
      created_at: { type: string, format: date-time }
  StudentGroup:
    type: object
    properties:
      id: { type: integer, example: 5 }
      name: { type: string, example: "Section A" }
      description: { type: string, example: "Morning students" }
      subject_id: { type: integer, example: 3 }
      workspace_id: { type: integer, example: 1 }
      created_by_membership_id: { type: integer, example: 4 }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  StudentGroupMember:
    type: object
    properties:
      id: { type: integer, description: "Workspace membership id", example: 12 }
      user_id: { type: integer, example: 42 }
      full_name: { type: string, example: "Jane Doe" }
      email: { type: string, example: "jane@school.edu" }
  UserProfile:
    type: object
    properties:
      id: { type: integer, example: 15 }
      full_name: { type: string, example: "Ahmed Ali" }
      email: { type: string, example: "ahmed@example.com" }
      phone_number: { type: string, example: "+9639xxxxxxx" }
      avatar_url: { type: string, example: "https://cdn.example.com/avatars/user123.png" }
      email_verified: { type: boolean, example: true }
      last_login_at: { type: string, format: date-time }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  WorkspaceTeacherMember:
    type: object
    properties:
      user_id: { type: integer, example: 14 }
      membership_id: { type: integer, example: 51 }
      full_name: { type: string, example: "Ahmed Ali" }
      email: { type: string, example: "ahmed@example.com" }
      avatar_url: { type: string }
      user_status: { type: string, example: "ACTIVE" }
      workspace_role: { type: string, example: "TEACHER" }
      membership_role: { type: string, example: "TEACHER" }
      assigned_subjects_count: { type: integer, example: 4 }
      created_at: { type: string, format: date-time }
  WorkspaceStudentMember:
    type: object
    properties:
      user_id: { type: integer, example: 21 }
      membership_id: { type: integer, example: 84 }
      full_name: { type: string, example: "Sara Mohamed" }
      email: { type: string, example: "sara@example.com" }
      avatar_url: { type: string }
      user_status: { type: string, example: "ACTIVE" }
      workspace_role: { type: string, example: "STUDENT" }
      enrolled_subjects_count: { type: integer, example: 5 }
  StudentGroupDetail:
    type: object
    properties:
      id: { type: integer, example: 5 }
      name: { type: string, example: "Section A" }
      description: { type: string, example: "Morning students" }
      subject_id: { type: integer, example: 3 }
      workspace_id: { type: integer, example: 1 }
      created_by_membership_id: { type: integer, example: 4 }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
      subject:
        type: object
        properties:
          id: { type: integer, example: 3 }
          name: { type: string, example: "Cybersecurity" }
      member_count: { type: integer, example: 3 }
      students:
        type: array
        items:
          $ref: "#/definitions/StudentGroupMember"
  SubjectWithTopics:
    type: object
    properties:
      id: { type: integer, example: 1 }
      name: { type: string, example: "Mathematics" }
      title: { type: string, example: "Mathematics" }
      description: { type: string }
      workspace_id: { type: integer }
      is_archived: { type: boolean }
      created_by_membership_id: { type: integer }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
      topics:
        type: array
        items:
          $ref: "#/definitions/TopicSummary"
  UpcomingTest:
    type: object
    properties:
      test_id: { type: integer }
      title: { type: string }
      subject: { type: string }
      teacher_name: { type: string }
      status: { type: string, example: PUBLISHED }
      availability_time_mode: { type: string, enum: [SCHEDULED, FLEXIBLE] }
      start_time: { type: string, format: date-time }
      end_time: { type: string, format: date-time }
      time_until_start_seconds: { type: integer }
      time_until_start_human: { type: string, example: "1 day left" }
      starts_on_entry: { type: boolean }
      availability_note: { type: string, example: "Starts on entry" }
      availability_window:
        type: object
        properties:
          available_from: { type: string, format: date-time }
          available_until: { type: string, format: date-time }
  StudentGradedResult:
    type: object
    properties:
      test_id: { type: integer }
      attempt_id: { type: integer }
      title: { type: string }
      subject: { type: string }
      teacher_name: { type: string }
      score: { type: number }
      max_score: { type: number }
      percentage: { type: number }
      status: { type: string, example: GRADED }
      graded_at: { type: string, format: date-time }
  ScheduleConflictError:
    type: object
    properties:
      error: { type: string, example: SCHEDULE_CONFLICT }
      message: { type: string }
      conflicting_test_ids:
        type: array
        items: { type: integer }
  TeacherScheduleConflictError:
    type: object
    properties:
      error: { type: string, example: TEACHER_SCHEDULE_CONFLICT }
      message: { type: string }
      conflicting_test_id: { type: integer, example: 42 }
  TestSummary:
    type: object
    properties:
      test_id: { type: integer }
      name: { type: string }
      slug: { type: string }
      subject_id: { type: integer }
      status: { type: string, example: PUBLISHED }
      duration_minutes: { type: integer }
      total_score: { type: number }
      passing_score: { type: number }
  TestAttempt:
    type: object
    properties:
      id: { type: integer }
      test_id: { type: integer }
      student_membership_id: { type: integer }
      user_id: { type: integer }
      status: { type: string, enum: [IN_PROGRESS, SUBMITTED, GRADED] }
      started_at: { type: string, format: date-time }
      submitted_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
      last_activity_at: { type: string, format: date-time }
      submission_source: { type: string, enum: [STUDENT, TIMEOUT, FORCE] }
      raw_score: { type: number }
      final_score: { type: number }
      requires_manual_grading:
        type: boolean
        description: True when essay questions still need teacher grading
      availability_time_mode: { type: string, enum: [SCHEDULED, FLEXIBLE] }
      global_end_at:
        type: string
        format: date-time
        description: SCHEDULED only — shared end time (starts_at + duration_minutes)
      remaining_seconds:
        type: integer
        description: Seconds until attempt deadline (expires_at for FLEXIBLE, global_end_at for SCHEDULED)
  TestAttemptRuntime:
    allOf:
      - $ref: "#/definitions/TestAttempt"
      - type: object
        properties:
          questions:
            type: array
            items:
              $ref: "#/definitions/RuntimeQuestion"
          answers:
            type: array
            items:
              $ref: "#/definitions/AttemptAnswer"
  StartAttemptResponse:
    type: object
    properties:
      message: { type: string }
      resumed: { type: boolean }
      attempt:
        $ref: "#/definitions/TestAttemptRuntime"
  SubmitAttemptResponse:
    type: object
    properties:
      message: { type: string }
      attempt:
        $ref: "#/definitions/TestAttemptRuntime"
  SaveAnswerItem:
    type: object
    required: [test_question_id]
    properties:
      test_question_id: { type: integer }
      answer_text: { type: string }
      selected_choice_indices:
        type: array
        items: { type: integer }
        description: Zero-based indices into snapshot choices
  AttemptAnswer:
    type: object
    properties:
      id: { type: integer }
      attempt_id: { type: integer }
      test_question_id: { type: integer }
      answer_text: { type: string }
      selected_choice_indices:
        type: array
        items: { type: integer }
      is_correct: { type: boolean }
      earned_score: { type: number }
      grading_status:
        type: string
        enum: [AUTO_GRADED, PENDING_REVIEW, MANUALLY_GRADED]
      updated_at: { type: string, format: date-time }
  RuntimeQuestion:
    type: object
    properties:
      test_question_id: { type: integer }
      snapshot_question_text: { type: string }
      snapshot_image_path: { type: string }
      snapshot_image_url: { type: string }
      snapshot_type_code: { type: string, example: MCQ }
      points: { type: number }
      choices:
        type: array
        items:
          type: object
          properties:
            index: { type: integer }
            body: { type: string }
            order_index: { type: integer }
