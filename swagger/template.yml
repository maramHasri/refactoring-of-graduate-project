            properties:
              membership_id: { type: integer }
              subject_ids:
                type: array
                items: { type: integer }
      responses:
        201:
          description: Subjects assigned
        403:
          description: Forbidden
        404:
          description: Not found
        422:
          description: Validation error
  /student-memberships/{membership_id}/subjects:
    get:
      tags: [Workspaces]
      operationId: listStudentSubjects
